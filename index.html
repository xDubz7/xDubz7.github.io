<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070a11">
<meta name="description" content="Localify Local - play your own music files on iPhone, offline. No YouTube, no streaming. Large WAV safe.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Localify">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Localify — Local Files</title>
<style>
:root{
  --bg:#070a11; --panel:#0e1320; --panel2:#141b2d; --line:#1f2a44;
  --text:#eef2fb; --dim:#93a1bd; --green:#1ed760; --green-d:#17b14f;
  --red:#ff5c5c; --amber:#ffb84d; --pink:#ff5c7a; --radius:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
/* Hatsune Miku theme — Gabriel's art direction (v4.3): TEAL leads (buttons,
   panels, progress, quiet waveform), and the TEXT goes hot pink. Secondary
   text stays soft teal; a thin pink banner strip under the header nods to
   his HiBy x Miku reference. */
[data-theme="miku"]{
  --bg:#050507; --panel:#0d0d12; --panel2:#17141f; --line:#2e2434;
  --text:#ff4d9d; --dim:#8fd0c8;
  --green:#39c5bb; --green-d:#1f9e94; --amber:#ffd166;
  --pink:#ff2e88; --pink-d:#d6006d;
}
[data-theme="miku"] header{border-bottom:2px solid var(--pink)}
[data-theme="miku"] .song.playing .title{color:var(--pink)}
/* Sonic the Hedgehog: hero blue leads (buttons, panels, progress), and —
   like Miku's pink — the TEXT and highlights are gold (his rings). */
[data-theme="sonic"]{
  --bg:#040814; --panel:#081226; --panel2:#0d1f3f; --line:#1c3560;
  --text:#ffd94d; --dim:#9db9e8;
  --green:#2f7bff; --green-d:#0057d9; --amber:#ffd23e;
  --pink:#ffd23e;
}
[data-theme="sonic"] header{border-bottom:2px solid var(--amber)}
[data-theme="sonic"] .song.playing .title{color:var(--amber)}
[data-theme="sonic"] .eqbars i{background:var(--amber)}
/* Shadow the Hedgehog: black, his red, and gold — same palette as the
   Gate Skipper Shadow theme. */
[data-theme="shadow"]{
  --bg:#050505; --panel:#0d0d0d; --panel2:#171717; --line:#2e2a26;
  --text:#f3ead8; --dim:#c9b896;
  --green:#e10600; --green-d:#9e0400; --amber:#f5c518;
  --pink:#f5c518;
}
[data-theme="shadow"] header{border-bottom:2px solid var(--pink)}
[data-theme="shadow"] .song.playing .title{color:var(--pink)}
[data-theme="shadow"] .eqbars i{background:var(--pink)}
/* Space: cosmic violet, starlight lavender text, aurora cyan accent —
   same palette as the Gate Skipper Space theme. */
[data-theme="space"]{
  --bg:#05060f; --panel:#0e1128; --panel2:#151a3d; --line:#232850;
  --dim:#c9c2ff;
  --green:#8b7cff; --green-d:#6a4fe0; --amber:#ffd166;
  --pink:#7dd3fc;
}
/* Every non-default theme uses its secondary accent (--pink) for
   favorite hearts and active transport toggles. */
[data-theme="miku"] .song .fav.on, [data-theme="sonic"] .song .fav.on,
/* SoundCloud: burnt orange on near-black (Gabriel's DJ platform). */
[data-theme="soundcloud"]{
  --bg:#0a0a0a; --panel:#131313; --panel2:#1c1c1c; --line:#2b2b2b;
  --dim:#a6a6a6;
  --green:#ff5500; --green-d:#d14400; --amber:#ffb38a;
  --pink:#ff8a50;
}
/* CDJ: deck grey/black with Pioneer blue. */
[data-theme="cdj"]{
  --bg:#0a0c0f; --panel:#11151b; --panel2:#1a2029; --line:#28303d;
  --dim:#93a5bd;
  --green:#0096ff; --green-d:#0076cc; --amber:#7dd3fc;
  --pink:#e8f4ff;
}
/* Vaporwave: deep purple, pink lead, cyan secondary, pale-yellow amber. */
[data-theme="vapor"]{
  --bg:#150826; --panel:#1f0b38; --panel2:#2a1150; --line:#3d2070;
  --text:#ffe9fb; --dim:#c9a6e8;
  --green:#ff71ce; --green-d:#d14ba8; --amber:#fffb96;
  --pink:#01cdfe;
}
/* Vinyl: warm amber/sepia on dark brown-black. */
[data-theme="vinyl"]{
  --bg:#16100a; --panel:#20180d; --panel2:#2b2011; --line:#3d2c15;
  --text:#f5e9cd; --dim:#bfa77e;
  --green:#e8a33d; --green-d:#bc7f24; --amber:#ffd98a;
  --pink:#d97b3f;
}
/* Dubstep: near-black violet, electric purple lead, magenta glitch fringe. */
[data-theme="dubstep"]{
  --bg:#07030d; --panel:#0e0718; --panel2:#180b2b; --line:#2e1754;
  --text:#f2eaff; --dim:#b7a6e3;
  --green:#a855f7; --green-d:#7c3aed; --amber:#f0abfc;
  --pink:#e879f9;
}
[data-theme="soundcloud"] .song .fav.on, [data-theme="cdj"] .song .fav.on,
[data-theme="vapor"] .song .fav.on, [data-theme="vinyl"] .song .fav.on{color:var(--pink)}
[data-theme="soundcloud"] .controls .pbtn.toggled, [data-theme="cdj"] .controls .pbtn.toggled,
[data-theme="vapor"] .controls .pbtn.toggled, [data-theme="vinyl"] .controls .pbtn.toggled{color:var(--pink)}
[data-theme="dubstep"] .song .fav.on{color:var(--pink)}
[data-theme="dubstep"] .controls .pbtn.toggled{color:var(--pink)}
[data-theme="shadow"] .song .fav.on, [data-theme="space"] .song .fav.on{color:var(--pink)}
[data-theme="miku"] .controls .pbtn.toggled, [data-theme="sonic"] .controls .pbtn.toggled,
[data-theme="shadow"] .controls .pbtn.toggled, [data-theme="space"] .controls .pbtn.toggled{color:var(--pink)}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);touch-action:manipulation;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.hidden{display:none !important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(7,10,17,.92);backdrop-filter:blur(10px);
  padding:calc(10px + var(--sat)) 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center}
#whatsnew{margin:10px 12px 0;padding:12px 14px 10px;border:1px solid var(--green);border-radius:14px;background:var(--panel)}
#whatsnew .wn-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#whatsnew .wn-head b{font-size:14px}
#wn-close{background:none;border:none;color:var(--dim);font-size:15px;line-height:1;padding:2px 6px;cursor:pointer}
#wn-list{margin:0;padding-left:18px;color:var(--dim);font-size:13px;line-height:1.55}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px}
.brand small{display:block;color:var(--dim);font-size:11px;font-weight:500}
.addbtn{margin-left:auto;background:var(--green);color:#04140a;font-weight:700;
  padding:9px 14px;border-radius:999px;font-size:14px}
.addbtn:active{background:var(--green-d)}
.addbtn.ghost{background:transparent;color:var(--green);border:1px solid var(--green);
  padding:8px 11px;font-size:13px;margin-left:0}
.addbtn.ghost:active{background:var(--panel2)}
.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:9px 14px;outline:none;font-size:16px}
.searchrow select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:0 8px;font-size:13px;max-width:118px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:#04140a;font-weight:700}

/* ---------- import bar ---------- */
#importbar{margin:12px 16px 0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px}
#importbar .row{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);gap:10px}
#importbar .row b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;background:var(--panel2);border-radius:99px;margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}

/* ---------- library ---------- */
main{padding:12px 12px calc(120px + var(--sab))}
.empty{margin:48px 20px;text-align:center;color:var(--dim);line-height:1.55}
.empty .big{font-size:40px;margin-bottom:10px}
.empty b{color:var(--text)}
.note{margin:14px 4px 0;font-size:12.5px;color:var(--dim);line-height:1.5;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.note b{color:var(--amber)}
.song{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:var(--radius)}
.song:active{background:var(--panel)}
.song.playing{background:var(--panel)}
.song .art{width:48px;height:48px;border-radius:10px;background:var(--panel2);flex:0 0 48px;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dim);overflow:hidden}
.song .art img{width:100%;height:100%;object-fit:cover}
.song .meta{flex:1;min-width:0}
.song .title{font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song.playing .title{color:var(--green)}
.song .sub{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;
  background:#3a2b12;color:var(--amber);border:1px solid #6b4d15;font-weight:700}
.badge.off{background:#33161a;color:var(--red);border-color:#6b232a}
.song .fav{font-size:20px;color:var(--dim);padding:6px}
.song .fav.on{color:var(--green)}
.song .dots{font-size:20px;color:var(--dim);padding:6px 2px}

/* ---------- mini player ---------- */
#mini{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sab));z-index:30;
  background:var(--panel2);border:1px solid var(--line);border-radius:16px;
  display:flex;align-items:center;gap:10px;padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#mini .art{width:42px;height:42px;border-radius:9px;background:var(--panel);flex:0 0 42px;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--dim);overflow:hidden}
#mini .art img{width:100%;height:100%;object-fit:cover}
#mini .meta{flex:1;min-width:0}
#mini .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini .sub{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.pbtn.main{background:var(--green);color:#04140a;font-size:19px}

/* ---------- full player ---------- */
#player{position:fixed;inset:0;z-index:40;background:transparent;overflow-y:auto;
  padding:calc(14px + var(--sat)) 22px calc(18px + var(--sab));display:flex;flex-direction:column}
#player>*{flex-shrink:0}
#player .close{align-self:flex-start;font-size:26px;color:var(--dim);padding:4px 8px}
#player .partwrap{position:relative;width:min(54vw,236px);height:min(54vw,236px);margin:10px auto}
#player .part{width:100%;height:100%;border-radius:18px;
  background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:84px;color:var(--dim);overflow:hidden}
#p-dancer{position:absolute;right:12px;bottom:8px;height:118px;width:auto;display:block;pointer-events:none}
#p-stage{position:absolute;inset:0;width:100%;height:100%;display:none;border-radius:18px}
.partwrap.stage-ring #p-dancer{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%)}
#player .part img{width:100%;height:100%;object-fit:cover}
#player h2{margin:8px 0 2px;font-size:21px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player .artist{text-align:center;color:var(--dim);font-size:15px;margin-bottom:4px}
#player .src{text-align:center;color:var(--dim);font-size:12px;margin-bottom:14px}
.seekrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.seekrow input{flex:1;accent-color:var(--green);height:28px}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.controls .pbtn.skip{width:44px;height:44px;font-size:12.5px;font-weight:700;color:var(--dim)}
#update-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(158px + var(--sab));z-index:61;
  background:var(--green);color:#04140a;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer;white-space:nowrap}
#update-pill .x{margin-left:10px;opacity:.65;font-weight:400}
.cuex{margin-left:7px;opacity:.6;font-weight:700}
.controls .pbtn{width:52px;height:52px;font-size:22px}
.controls .pbtn.main{width:66px;height:66px;font-size:27px}
.controls .pbtn.toggled{color:var(--green)}
.volrow{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--dim);font-size:14px}
.volrow input{flex:1;accent-color:var(--green)}

/* ---------- icons (SVG, no emoji buttons) ---------- */
.pbtn svg{display:block;width:24px;height:24px}
.pbtn.main svg{width:30px;height:30px}
#mini .pbtn svg{width:22px;height:22px}
#mini .prog{position:absolute;top:0;left:14px;right:14px;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
#mini .prog i{display:block;height:100%;width:0;background:var(--green)}
#mini{overflow:hidden}
.song .fav svg,.song .dots svg{display:block;width:22px;height:22px}
.song .art svg{width:22px;height:22px}
#mini .art svg{width:20px;height:20px}
#player .part svg{width:118px;height:118px}
#player .close svg{display:block;width:26px;height:26px}
.empty .big svg{width:52px;height:52px;color:var(--green)}
.chip svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.vic{display:flex}.vic svg{display:block;width:20px;height:20px}

/* ---------- playing-row EQ bars ---------- */
.eqbars{display:flex;align-items:flex-end;gap:2.5px;height:16px}
.eqbars i{display:block;width:3.5px;height:100%;background:var(--green);border-radius:2px;
  transform-origin:bottom;animation:eqb .9s ease-in-out infinite}
.eqbars i:nth-child(2){animation-delay:.22s}.eqbars i:nth-child(3){animation-delay:.45s}.eqbars i:nth-child(4){animation-delay:.12s}
.eqbars.still i{animation-play-state:paused;transform:scaleY(.35)}
@keyframes eqb{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* ---------- waveform seek ---------- */
#p-wave{flex:1;min-width:0;height:46px;touch-action:none;cursor:pointer}
#p-scroll{width:100%;height:54px;display:block;margin-top:8px}

/* ---------- player extras: sleep + EQ ---------- */
.eqrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.eqlab{color:var(--dim);font-size:13px;font-weight:700;letter-spacing:.06em}
.eqchips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
.eqchips::-webkit-scrollbar{display:none}
.eqchips .eqchip{flex:none}
.ptabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:14px}
.ptab{flex:1;padding:7px 0;border-radius:999px;color:var(--dim);font-size:13.5px;font-weight:600}
.ptab.on{background:var(--green);color:#04140a}
.prow{margin-top:10px}
.eqchip{padding:6px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);font-size:13px}
.eqchip.on{background:var(--green);border-color:var(--green);color:#04140a;font-weight:700}
.tdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:21px;height:21px}
.extrarow{display:flex;justify-content:center;margin-top:12px}
.xbtn{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:13.5px}
.xbtn svg{display:block;width:18px;height:18px}
.xbtn.on{color:var(--green);border-color:var(--green)}

/* ---------- sheet / toast ---------- */
#sheetWrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
#sheet{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + var(--sab));max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheet h3{margin:4px 0 10px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet button{display:block;width:100%;text-align:left;padding:13px 6px;font-size:15.5px;border-bottom:1px solid var(--line)}
#sheet button:last-child{border-bottom:0}
#sheet button.danger{color:var(--red)}
#sheet .sheetnote{font-size:13.5px;opacity:.75;margin:2px 0 10px;line-height:1.45}
#sheet .duprow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
#sheet .duprow .dupmeta{flex:1;min-width:0}
#sheet .duprow .dupmeta b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .duprow .dupmeta span{font-size:12.5px;opacity:.7}
#sheet .duprow button{width:auto;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--red)}
#sheet .statrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
#sheet .statrow span{opacity:.75}
#sheet .statrow b{font-weight:600;text-align:right}
#sheet .statslabel{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.6;margin:16px 0 2px}
#sheet .dupsep{height:10px}
/* ---------- playlist form ---------- */
#plWrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
#plsheet{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + var(--sab))}
#plsheet h3{margin:4px 0 10px;font-size:16px}
#plsheet input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:12px 14px;outline:none;font-size:16px}
.plrow{display:flex;gap:10px;margin-top:12px}
.plrow button{flex:1;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.plrow button.primary{background:var(--green);border-color:var(--green);color:#04140a;font-weight:700}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));z-index:60;
  background:#1c2740;border:1px solid var(--line);color:var(--text);font-size:14px;
  padding:10px 16px;border-radius:999px;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* ================= theme backgrounds (5.10: richer scenes, still player view only) =================
 * A fixed layer INSIDE the full player view, behind its content. Every
 * scene = a soft colour wash + a few layers of motion. Transform and
 * opacity only (no filters, no JS, no audio), so it stays smooth on
 * a phone. prefers-reduced-motion switches the motion off. */
#bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.bglayer{position:absolute;inset:0;display:none;overflow:hidden}
[data-theme="green"] .bgl-green,[data-theme="miku"] .bgl-miku,[data-theme="sonic"] .bgl-sonic,
[data-theme="shadow"] .bgl-shadow,[data-theme="space"] .bgl-space,[data-theme="soundcloud"] .bgl-soundcloud,
[data-theme="cdj"] .bgl-cdj,[data-theme="vapor"] .bgl-vapor,[data-theme="vinyl"] .bgl-vinyl,[data-theme="dubstep"] .bgl-dubstep{display:block}
.bglayer>*{position:absolute}
@keyframes bgSpinY{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes bgBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes bgRot{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* shared pieces */

.bgdot{border-radius:50%;bottom:-20px;animation:bgRise linear infinite}

/* Localify: green wash + a live equalizer along the bottom */
.bgl-green .wash{background:radial-gradient(70% 38% at 50% 104%,rgba(30,215,96,.30),transparent 72%),radial-gradient(55% 30% at 100% 0,rgba(30,215,96,.13),transparent 70%),radial-gradient(45% 25% at 0 45%,rgba(255,176,32,.07),transparent 70%);animation:bgBreathe 7s ease-in-out infinite}
.bgripple{left:50%;bottom:-18vw;width:36vw;height:36vw;margin-left:-18vw;border-radius:50%;border:2px solid rgba(30,215,96,.55);box-shadow:0 0 22px rgba(30,215,96,.25),inset 0 0 22px rgba(30,215,96,.12);animation:bgRipple 8s ease-out infinite}
.bgorb{border-radius:50%;bottom:-30px;background:radial-gradient(circle,rgba(30,215,96,.55),rgba(30,215,96,0) 70%);animation:bgRise linear infinite}

/* Miku: teal + pink glow, a checkered field of leeks and notes drifting diagonally, sparkles */

.bgl-miku .wash{background:radial-gradient(60% 36% at 0 100%,rgba(57,197,187,.26),transparent 70%),radial-gradient(55% 32% at 100% 8%,rgba(255,77,157,.20),transparent 70%),radial-gradient(40% 20% at 60% 60%,rgba(57,197,187,.07),transparent 70%);animation:bgBreathe 9s ease-in-out infinite}
.bgm01{left:0;top:0;opacity:.14;animation:bgDvdX 9.4s linear infinite alternate}
.bgm01 img{width:150px;display:block;animation:bgDvdY 6.9s linear infinite alternate}
.bgspark{color:#9ff3ec;animation:bgTwinkle 2.8s ease-in-out infinite}

/* Sonic: speed streaks, checkered hill, spinning rings */
.bgl-sonic .wash{background:radial-gradient(75% 40% at 50% 104%,rgba(0,120,255,.34),transparent 72%),radial-gradient(50% 30% at 85% 10%,rgba(90,170,255,.16),transparent 70%)}
.bgring{border-radius:50%;border:7px solid #ffd23e;box-shadow:0 0 20px rgba(255,210,62,.55),inset 0 0 12px rgba(255,210,62,.55);animation:bgSpinY 1.7s linear infinite}
.bgringw{animation:bgBounce 2.6s ease-in-out infinite}
.bgstreak{left:0;height:2px;width:46vw;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(190,225,255,.75),transparent);animation:bgStreak linear infinite}
.bghill{left:0;right:-96px;bottom:0;height:14vh;opacity:.5;background:conic-gradient(rgba(0,90,200,.55) 25%,rgba(0,40,110,.35) 0 50%,rgba(0,90,200,.55) 0 75%,rgba(0,40,110,.35) 0) 0 0/96px 96px;-webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent);animation:bgScroll 3s linear infinite}

/* Shadow: red glow, embers, dark gold rings */
.bgl-shadow .wash{background:radial-gradient(75% 42% at 50% 106%,rgba(225,6,0,.38),transparent 72%),radial-gradient(60% 40% at 50% -10%,rgba(0,0,0,.6),transparent 70%),radial-gradient(40% 24% at 8% 50%,rgba(225,6,0,.10),transparent 70%);animation:bgFlicker 3.4s ease-in-out infinite}

.bgember{background:radial-gradient(circle,#ffb347,#e10600 60%,transparent 72%)}
.bgemerald{opacity:.9;animation:bgGemFloat 6s ease-in-out infinite}
.bgemerald:before{content:'';position:absolute;inset:-50%;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 65%);opacity:.26}
.bgemerald i{position:absolute;inset:0;clip-path:polygon(50% 0,88% 22%,100% 56%,50% 100%,0 56%,12% 22%);background:linear-gradient(115deg,transparent 45%,rgba(255,255,255,.55) 50%,transparent 55%),linear-gradient(245deg,transparent 45%,rgba(0,0,0,.20) 50%,transparent 55%),linear-gradient(180deg,rgba(255,255,255,.38),rgba(0,0,0,.24)),var(--c)}
.bgemerald i:after{content:'';position:absolute;left:27%;right:27%;top:15%;height:32%;background:rgba(255,255,255,.42);clip-path:polygon(50% 0,100% 42%,50% 100%,0 42%)}

/* Space: nebula, three star layers, shooting stars, planet */
.bgl-space .wash{background:linear-gradient(180deg,rgba(10,6,40,.0),rgba(30,16,80,.35))}
.bgneb{border-radius:50%;animation:bgNeb 26s ease-in-out infinite}
.bgstarl{left:0;top:0;width:2px;height:2px;border-radius:50%;animation:bgTwinkle 3.6s ease-in-out infinite}

.bgplanet{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#c4b5fd,#7c6cf0 46%,#3b2f7a);box-shadow:0 0 40px rgba(139,124,255,.35);animation:bgBob 7s ease-in-out infinite}

.bggalaxy{width:190px;height:190px;border-radius:50%;opacity:.55;background:radial-gradient(circle,rgba(255,255,255,.7) 0 6%,transparent 26%),conic-gradient(from 0deg,transparent,rgba(139,124,255,.6) 12%,transparent 30%,rgba(125,211,252,.45) 46%,transparent 62%,rgba(139,124,255,.5) 82%,transparent);animation:bgRot 70s linear infinite}

/* SoundCloud: sunset glow, drifting clouds, orange waveform */
.bgl-soundcloud .wash{background:radial-gradient(80% 42% at 50% 106%,rgba(255,85,0,.34),transparent 72%),radial-gradient(60% 30% at 100% 0,rgba(255,140,60,.10),transparent 70%)}
.bgcloud{left:0;display:flex;align-items:flex-end;gap:3px;animation:bgDrift linear infinite}

.bgrays{left:50%;bottom:-60vw;width:120vw;height:120vw;margin-left:-60vw;border-radius:50%;opacity:.55;background:repeating-conic-gradient(from 0deg,rgba(255,120,40,.20) 0 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%);mask-image:radial-gradient(circle,#000 0,transparent 62%);animation:bgRays 90s linear infinite}
.bgscsun{left:50%;bottom:-17vw;width:34vw;height:34vw;max-width:260px;max-height:260px;min-width:170px;min-height:170px;margin-left:calc(-1 * clamp(85px,17vw,130px));border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffb27a,#ff5500 62%,#c43a00);box-shadow:0 0 70px rgba(255,85,0,.55);animation:bgBreathe 8s ease-in-out infinite}

/* CDJ: laser fan, jog wheels, hot-cue pads */
.bgl-cdj .wash{background:radial-gradient(70% 40% at 50% 104%,rgba(0,150,255,.26),transparent 72%),radial-gradient(40% 25% at 0 0,rgba(0,150,255,.10),transparent 70%)}
.bgbeam{left:50%;bottom:-2vh;width:3px;height:92vh;margin-left:-1.5px;transform-origin:50% 100%;background:linear-gradient(0deg,rgba(0,170,255,.55),rgba(0,170,255,.12) 55%,transparent);animation:bgBeam 6s ease-in-out infinite}
.bgjog{border-radius:50%;border:10px solid #2a3442;box-shadow:0 0 28px rgba(0,150,255,.22),inset 0 0 0 3px rgba(160,190,220,.25);animation:bgRot 14s linear infinite}
.bgjog:before{content:'';position:absolute;inset:16px;border-radius:50%;border:2px dashed rgba(0,150,255,.45)}

.bgpad{width:26px;height:26px;border-radius:7px;animation:bgPulse 2.2s ease-in-out infinite}

/* Vaporwave: striped sun on the horizon, rolling grid, haze */
.bgl-vapor .wash{background:linear-gradient(180deg,rgba(80,20,120,.0) 0,rgba(255,41,117,.14) 70%,rgba(255,113,206,.30) 82%,rgba(10,4,24,.0) 82.5%),radial-gradient(60% 24% at 50% 82%,rgba(255,113,206,.30),transparent 70%)}
.bgsun{left:50%;margin-left:-85px;top:70%;width:170px;height:170px;border-radius:50%;opacity:.6;background:repeating-linear-gradient(180deg,transparent 0 13px,rgba(21,8,38,.7) 13px 17px),linear-gradient(180deg,#ffd319,#ff2975 62%,#ff71ce);-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent 100%);mask-image:linear-gradient(180deg,#000 60%,transparent 100%);animation:bgBob 9s ease-in-out infinite}

.bgl-vinyl .wash{background:radial-gradient(60% 40% at 78% 8%,rgba(232,163,61,.18),transparent 70%),radial-gradient(70% 38% at 40% 106%,rgba(232,163,61,.22),transparent 72%)}

.bgdisc:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 25deg,rgba(255,255,255,.14),transparent 32%,rgba(255,255,255,.06) 58%,transparent 74%)}

.bgl-dubstep .wash{background:radial-gradient(65% 34% at 50% 0%,rgba(124,58,237,.20),transparent 70%),radial-gradient(70% 36% at 50% 108%,rgba(168,85,247,.22),transparent 72%)}

<script>
'use strict';
/*
 * Localify Local — iPhone / Safari build (local files only)
 * =========================================================
 * Why this build exists:
 *  - No Mac / Xcode, so no native app: this is a single HTML file for Safari.
 *    Add it to the Home Screen and it behaves like an app.
 *  - YouTube is gone entirely: no search, no streaming, no downloads,
 *    no artwork/id "backfill" phoning YouTube. Local files only.
 *
 * Why the old build crashed Safari on 600 MB – 1.5 GB WAVs (fixed here):
 *  1. Loudness normalisation ran on every play: it took the whole
 *     file's arrayBuffer and ran the Web Audio decode call on it.
 *     That copies the WHOLE file into RAM, then decodes it to Float32 PCM.
 *     A 1.5 GB WAV decodes to roughly 3 GB of samples — iOS kills the tab.
 *     -> This build never decodes audio in JS. No decodeAudioData, ever.
 *  2. Imports now copy audio to OPFS in bounded chunks. IndexedDB
 *     still holds track metadata and previously stored audio.
 *  3. There is exactly ONE <audio> element and ONE object URL alive at a
 *     time. No standby/crossfade deck pre-loading the next huge file,
 *     no pre-buffering, no hidden copies.
 *  Tag reading is paged (64 KB slices via blob.slice), including a WAV
 *  chunk walk that jumps over the data chunk instead of reading it, so
 *  reading the tags of a 1.5 GB WAV touches only a few KB. RF64 WAVs
 *  (data size in a ds64 chunk) are handled too.
 */

/* ================= storage ================= */
const DB = (() => {
  let p = null;
  function open() {
    if (p) return p;
    p = new Promise((resolve, reject) => {
      const req = indexedDB.open('localify-local', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        db.createObjectStore('tracks', { keyPath: 'id' });
        db.createObjectStore('files',  { keyPath: 'id' });
        db.createObjectStore('covers', { keyPath: 'id' });
        db.createObjectStore('meta',   { keyPath: 'key' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return p;
  }
  const wrap = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function store(name, mode) { const db = await open(); return db.transaction(name, mode).objectStore(name); }
  async function write(name, operation) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(name, 'readwrite');
      tx.oncomplete = () => resolve();
      tx.onabort = () => reject(tx.error);
      operation(tx.objectStore(name));
    });
  }
  return {
    get:    async (n, k) => wrap((await store(n, 'readonly')).get(k)),
    getAll: async (n)    => wrap((await store(n, 'readonly')).getAll()),
    keys:   async (n)    => wrap((await store(n, 'readonly')).getAllKeys()),
    put:    async (n, v) => write(n, (os) => os.put(v)),
    del:    async (n, k) => write(n, (os) => os.delete(k)),
  };
})();

async function audioDirectory(create = false) {
  const root = await navigator.storage.getDirectory();
  return root.getDirectoryHandle('localify-audio', { create });
}

async function copyAudio(file) {
  const directory = await audioDirectory(true);
  const key = crypto.randomUUID();
  let writer;
  try {
    const handle = await directory.getFileHandle(key, { create: true });
    writer = await handle.createWritable();
    for (let offset = 0; offset < file.size; offset += COPY_CHUNK_BYTES) {
      const end = Math.min(file.size, offset + COPY_CHUNK_BYTES);
      await writer.write(await file.slice(offset, end).arrayBuffer());
      if (state.importing) {
        state.importing.fileProgress = end / file.size;
        renderImport();
      }
    }
    await writer.close();
    return key;
  } catch (error) {
    if (writer) await writer.abort().catch(() => {});
    await directory.removeEntry(key).catch(() => {});
    throw error;
  }
}

async function removeStoredAudio(key) {
  if (!key) return;
  const directory = await audioDirectory();
  await directory.removeEntry(key);
}

/* ================= state ================= */
const state = {

  byId: new Map(),

  dayStats: {},         // 'YYYY-MM-DD' -> {plays, sec}
  playlists: [],        // {name, ids:[]}
  filter: 'all',        // all | fav | pl:<index>
  sort: 'title',
  query: '',
  queue: [], qIndex: -1,

let playToken = 0;
/* Interruption recovery: wantPlay records the USER's intent to be
   playing. A pause event that arrives while wantPlay is still set
   means the SYSTEM paused us (alarm, call, Siri) — recoverable.
   See the recovery block by the audio listeners. */
let wantPlay = false;
let interrupted = false;
let interruptPos = 0;
let lastReviveAt = 0;

/* ================= listening stats =================
   listenedSec accrues only while the audio actually advances: the
   ticker in the timeupdate handler credits currentTime deltas in
   (0, 2] s, so pauses, seeks and stalls never count. Flushes land
   on pause, song switch, song end, app hide, and every 30 s. */
let listenAcc = 0;
let listenLast = -1;
let listenSongId = null;
function dayKey(ts) { const d = new Date(ts || Date.now()); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function flushListen() {
  const s = listenSongId ? state.byId.get(listenSongId) : null;
  if (s && listenAcc >= 1) {
    const add = Math.round(listenAcc);
    s.listenedSec = (s.listenedSec || 0) + add;
    dayRec().sec += add;
    DB.put('tracks', s).catch(() => {});
    saveMeta();
  }
  listenAcc = 0; listenLast = -1;
}
setInterval(() => { if (!audio.paused && state.currentId) flushListen(); }, 30000);

function saveMeta() {
  DB.put('meta', { key: 'app', value: {
    favorites: [...state.favorites],
    playlists: state.playlists,
    sort: state.sort, shuffle: state.shuffle, repeat: state.repeat,
    theme: state.theme, currentId: state.currentId, rate: state.rate, pitchLock: state.pitchLock,
    dancer: state.dancer !== false, seenBuild: state.seenBuild || null, waveStyle: state.waveStyle || 'bands', stageStyle: state.stageStyle || 'art', waveMode: state.waveMode || 'peaks',
    history: state.history || [], dayStats: state.dayStats || {},
  }}).catch(() => {});
}
async function loadMeta() {
  try {
    const row = await DB.get('meta', 'app');
    const v = (row && row.value) || {};
    state.favorites = new Set(v.favorites || []);
    state.playlists = Array.isArray(v.playlists) ? v.playlists : [];
    state.sort = v.sort || 'title';
    state.shuffle = !!v.shuffle; state.repeat = v.repeat || 'off';
    state.theme = v.theme || 'green';
    state.rate = Number(v.rate) || 1;
    state.pitchLock = v.pitchLock !== false;
    state.dancer = v.dancer !== false;
    state.seenBuild = v.seenBuild || null;
    state.waveStyle = ['bands', 'led', 'curve'].includes(v.waveStyle) ? v.waveStyle : 'bands';
    state.stageStyle = ['art', 'ring', 'spectrum', 'waterfall', 'mirror', 'scope', 'particles'].includes(v.stageStyle) ? v.stageStyle : 'art';
    state.waveMode = v.waveMode === 'rms' ? 'rms' : 'peaks';
    state.history = Array.isArray(v.history) ? v.history : [];
    state.dayStats = (v.dayStats && typeof v.dayStats === 'object') ? v.dayStats : {};
    state.currentId = v.currentId || null;
  } catch (e) { /* first run */ }

/* ================= tiny helpers ================= */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');

function fmtSize(bytes) {
  if (!bytes) return '';
  const u = ['B', 'KB', 'MB', 'GB']; let n = bytes, i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + ' ' + u[i];

/* Waveform peaks for WAVs WITHOUT decoding the file: WAV data is raw PCM,
   so a peak per bucket comes from sampling a small window of bytes at each
   bucket position (a few KB read per bucket, never the whole file — the
   1.5 GB case reads ~23 MB total in slices). Peaks are 0..1 floats. */
async function computeWavPeaks(r, info, buckets) {
  buckets = buckets || 480;
  if (!info || !info.dataStart || !info.dataLen || !info.blockAlign) return null;
  const bits = info.bitsPerSample || 0;
  const fmt = info.audioFormat || 1;
  if (!((fmt === 1 && (bits === 8 || bits === 16 || bits === 24 || bits === 32)) || (fmt === 3 && bits === 32))) return null;

  const frames = Math.floor(info.dataLen / info.blockAlign);
  if (frames <= 0) return null;

  const winFrames = Math.min(4096, Math.max(256, Math.floor(perBucket)));

  const rmsSq = new Array(buckets).fill(0), rmsN = new Array(buckets).fill(0);
  const dv = (buf) => new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const sampleAt = (view, buf, o) => {
    if (fmt === 3) return view.getFloat32(o, true);
    if (bits === 16) return view.getInt16(o, true) / 32768;
    if (bits === 8) return (buf[o] - 128) / 128;
    if (bits === 24) { let x = buf[o] | (buf[o + 1] << 8) | (buf[o + 2] << 16); if (x & 0x800000) x -= 0x1000000; return x / 8388608; }
    return view.getInt32(o, true) / 2147483648;

     passage anywhere in the bucket registers in its peak. */
  for (let b = 0; b < buckets; b++) {
    const bucketStart = Math.floor(b * perBucket);
    const offsets = [0, Math.floor(perBucket / 2), Math.max(0, Math.floor(perBucket) - winFrames)];

    for (const off of offsets) {

/* Iterative radix-2 FFT (in place, Float32Arrays). Used only on file

function fftInPlace(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {

      t = im[i]; im[i] = im[j]; im[j] = t;

        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + half] = ur - vr; im[i + k + half] = ui - vi;

async function computeFinePeaks(r, info, t0, t1, buckets) {
  if (!info || !info.dataStart || !info.dataLen || !info.blockAlign || !info.sampleRate) return null;

  const a1 = 1 - Math.exp((-2 * Math.PI * 250) / sr);
  const a2 = 1 - Math.exp((-2 * Math.PI * 4000) / sr);

    if (fmt === 3) return view.getFloat32(o, true);

    if (bits === 24) { let x = buf[o] | (buf[o + 1] << 8) | (buf[o + 2] << 16); if (x & 0x800000) x -= 0x1000000; return x / 8388608; }

    const n = Math.min(CHUNK, endFrame - framePos);
    const buf = await r.read(info.dataStart + framePos * info.blockAlign, n * info.blockAlign);
    const got = Math.floor(buf.length / info.blockAlign);
    if (!got) break;
    const view = dv(buf);

      let acc = 0;
      const base = fr * info.blockAlign;
      for (let c = 0; c < ch; c++) acc += sampleAt(view, buf, base + c * bps);
      const mono = acc / ch;
      const v = Math.abs(mono);
      const b = Math.min(buckets - 1, Math.floor((framePos + fr - startFrame) / perBucket));
      if (v > out[b]) out[b] = v;
      if (v > Math.abs(wv[b])) wv[b] = mono;
      lp1 += a1 * (mono - lp1);
      lp2 += a2 * (mono - lp2);
      const lv = Math.abs(lp1), mv = Math.abs(lp2 - lp1), hv = Math.abs(mono - lp2);
      if (lv > bLow[b]) bLow[b] = lv;
      if (mv > bMid[b]) bMid[b] = mv;
      if (hv > bHigh[b]) bHigh[b] = hv;
      ring[ringPos] = mono;
      ringPos = (ringPos + 1) % FFT_N;
      if (++sinceSlice >= sliceEvery) { sinceSlice = 0; runSpecSlice(); }
    }
    framePos += got;
    await tick();
  }
  /* Normalise the band slices to the window's loudest moment. */
  let spec = null;
  if (specRaw.length > 1) {
    let mx = 0;
    for (const row of specRaw) for (let b = 0; b < SPEC_BANDS; b++) if (row[b] > mx) mx = row[b];
    if (mx > 0.001) {
      const data = new Float32Array(specRaw.length * SPEC_BANDS);
      specRaw.forEach((row, si) => { for (let b = 0; b < SPEC_BANDS; b++) data[si * SPEC_BANDS + b] = row[b] / mx; });

    }

  return { peaks: out, wave: wv, low: bLow, mid: bMid, high: bHigh, spec };
}

async function peaksForFile(file) {

    const r = new SliceReader(file);

async function parseId3At(r, start) {

    const id = txt(body, o, o + 4);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const len = frameSize(body, o + 4);
    if (len <= 0 || o + 10 + len > body.length + 10) { /* truncated frame: stop */ }

}

async function parseFlac(r) {
  const h = await r.read(0, 8);
  if (txt(h, 0, 4) !== 'fLaC') throw new Error('not flac');
  const blockLen = (h[5] << 16) | (h[6] << 8) | h[7];
  const b = await r.read(8, Math.min(blockLen, 34));
  if (b.length < 34) return {};
  const sampleRate = (b[10] << 12) | (b[11] << 4) | (b[12] >> 4);
  const totalSamples = Number((BigInt(b[13] & 0x0f) << 32n) |
    BigInt((b[14] << 24) | (b[15] << 16) | (b[16] << 8) | b[17]));
  return { duration: sampleRate && totalSamples ? totalSamples / sampleRate : 0 };
}

/* Duration via the browser's own metadata load — it streams headers,
   it does not hand the file to JS. Used only when no header duration. */
function probeDuration(file) {
  return new Promise((resolve) => {
    const a = new Audio();
    const url = URL.createObjectURL(file);
    let done = false;
    const finish = (d) => { if (done) return; done = true; URL.revokeObjectURL(url); a.removeAttribute('src'); resolve(isFinite(d) && d > 0 ? d : 0); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => finish(a.duration);
    a.onerror = () => finish(0);
    setTimeout(() => finish(a.duration || 0), 8000);
    a.src = url;
  });
}

async function readTags(file) {
  const r = new SliceReader(file);
  const lower = file.name.toLowerCase();
  let info = {};
  try {
    if (lower.endsWith('.wav') || lower.endsWith('.aif') || lower.endsWith('.aiff')) {
      info = await parseWav(r);
      if (lower.endsWith('.wav') && info.dataStart) {
        try { const wp = await computeWavPeaks(r, info); info.peaks = wp && wp.peaks; info.rms = wp && wp.rms; } catch (e) { /* peaks are decorative */ }
      }
    }
    else if (lower.endsWith('.flac')) info = await parseFlac(r);
    else if (lower.endsWith('.mp3')) info = await parseId3At(r, 0);
  } catch (e) { info = {}; }
  let duration = info.duration || 0;
  if (!duration) duration = await probeDuration(file);
  return {
    title: (info.title || '').trim() || cleanName(file.name) || 'Untitled',
    artist: (info.artist || '').trim() || 'Unknown Artist',
    album: (info.album || '').trim() || '',
    duration: Math.round((duration || 0) * 10) / 10,
    peaks: info.peaks || null,
    rms: info.rms || null,
  };
}

/* ================= import ================= */
function renderImport() {
  const bar = $('#importbar');
  if (!state.importing) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const { done, total, name, fileProgress = 0 } = state.importing;
  $('#ib-name').textContent = 'Adding: ' + (name || '');
  $('#ib-count').textContent = done + ' / ' + total;
  $('#ib-fill').style.width = (total ? Math.min(99, Math.round((done + fileProgress) / total * 100)) : 0) + '%';
}

async function saveTrackAudio(record, file) {
  let audioKey;
  let legacyBlob = false;
  try {
    if (navigator.storage?.getDirectory && globalThis.FileSystemFileHandle?.prototype.createWritable) {
      audioKey = await copyAudio(file);
    } else if (file.size < LEGACY_BLOB_LIMIT) {
      // Compatibility for browsers without writable OPFS.
      await DB.put('files', { id: record.id, blob: file });
      legacyBlob = true;
    }
  } catch (error) {
    console.warn('Audio could not be saved', error);
  }

  const persisted = Boolean(audioKey || legacyBlob);
  const updated = { ...record, audioKey, persisted, sessionOnly: !persisted, needsFile: false };
  try {
    await DB.put('tracks', updated);
    Object.assign(record, updated);
  } catch (error) {
    await removeStoredAudio(audioKey).catch(() => {});
    if (legacyBlob) await DB.del('files', record.id).catch(() => {});
    Object.assign(record, { persisted: false, sessionOnly: true, needsFile: false });
    console.warn('Track metadata could not be saved', error);
  }
}

async function importOneFile(file) {
  const id = fileId(file);
  const existing = state.byId.get(id) || state.songs.find((song) =>
    !song.persisted && song.fileName === file.name && song.size === file.size);
  if (existing) {
    sessionFiles.set(existing.id, file);
    if (!existing.persisted) await saveTrackAudio(existing, file);
    existing.needsFile = false;
    return existing.persisted ? 'attached' : 'session';
  }

  const info = await readTags(file);
  const record = {
    id, title: info.title, artist: info.artist, album: info.album,
    duration: info.duration, size: file.size, mime: file.type || '',
    fileName: file.name, addedAt: Date.now(), peaks: info.peaks || null, rms: info.rms || null,
    persisted: false, sessionOnly: true, needsFile: false,
  };
  await saveTrackAudio(record, file);
  sessionFiles.set(id, file);
  state.songs.push(record);
  state.byId.set(id, record);
  return record.persisted ? 'added' : 'session';
}

async function importFiles(fileList) {
  const files = Array.from(fileList || []).filter((f) => f && (AUDIO_EXT.test(f.name) || String(f.type || '').startsWith('audio/')));
  if (!files.length) { toast('No audio files in that selection'); return; }
  if (state.importing) { toast('Still adding — one moment'); return; }
  state.importing = { done: 0, total: files.length, name: files[0].name };
  renderImport();
  let added = 0, session = 0, attached = 0, failed = 0;
  for (const file of files) {
    state.importing.name = file.name; state.importing.fileProgress = 0; renderImport();
    try {
      const out = await importOneFile(file);
      if (out === 'added') added++; else if (out === 'session') session++;
      else if (out === 'attached') attached++;
    } catch (e) { failed++; console.warn('Could not import', file.name, e); }
    state.importing.done++; state.importing.fileProgress = 0; renderImport();
    await tick(); /* let Safari breathe between files */
  }
  state.importing = null; renderImport(); render();
  const bits = [];
  if (added) bits.push(added + ' saved on this device');
  if (session) bits.push(session + ' playable for this session only. Re-add after reload.');
  if (attached) bits.push(attached + ' linked and saved');
  if (failed) bits.push(failed + ' failed');
  toast(bits.join(' · ') || 'Nothing new to add');
}

/* ================= library rendering ================= */
function visibleSongs() {
  let list = state.songs.slice();
  if (state.filter === 'fav') list = list.filter((s) => state.favorites.has(s.id));
  else if (state.filter.startsWith('pl:')) {
    const pl = state.playlists[Number(state.filter.slice(3))];
    if (pl) { const set = new Set(pl.ids); list = list.filter((s) => set.has(s.id)); }
  }
  if (state.query) {
    const q = state.query.toLowerCase();
    list = list.filter((s) => (s.title + ' ' + s.artist + ' ' + s.album + ' ' + s.fileName).toLowerCase().includes(q));
  }
  const by = state.sort;
  list.sort((a, b) =>
    by === 'artist' ? (a.artist + a.title).localeCompare(b.artist + b.title) :
    by === 'recent' ? (b.addedAt || 0) - (a.addedAt || 0) :
    by === 'size-desc' ? (b.size || 0) - (a.size || 0) :
    by === 'most' ? (b.plays || 0) - (a.plays || 0) :
    by === 'played' ? (b.lastPlayed || 0) - (a.lastPlayed || 0) :
    a.title.localeCompare(b.title));
  return list;
}

function render() {
  renderChips();
  const main = $('#main');

  if (!state.songs.length) {
    main.innerHTML = `<div class="empty"><div class="big">${icon('note')}</div>
      <b>Your library is empty</b><br>Tap <b>+ Add music</b> and pick songs from Files,
      or <b>+ Folder</b> to add a whole folder at once
      (MP3, FLAC, WAV, M4A…). They play right here — offline, no account, no YouTube.
      <div class="note">Localify saves audio on this device when browser storage is available.
      If a file can only play for this session, re-add it later to reconnect it to its library entry.</div></div>`;

    return;

      : icon('note');

      <div class="art">${art}</div>
      <div class="meta">
        <div class="title">${esc(s.title)}${badge}</div>
        <div class="sub">${esc(s.artist)}${s.album ? ' · ' + esc(s.album) : ''} · ${fmtTime(s.duration)} · ${fmtSize(s.size)}${s.pos > 5 ? ' · resume at ' + fmtTime(s.pos) : ''}${s.plays ? ' · ' + s.plays + (s.plays === 1 ? ' play' : ' plays') : ''}</div>
      </div>
      <button class="fav ${state.favorites.has(s.id) ? 'on' : ''}" data-fav="${esc(s.id)}" aria-label="Favorite">${icon(state.favorites.has(s.id) ? 'heartFill' : 'heart')}</button>
      <button class="dots" data-menu="${esc(s.id)}" aria-label="More">${icon('dots')}</button>
    </div>`;
  }).join('');
}

/* ================= playback path note =================
 * NOTE (v4): there is deliberately NO Web Audio routing any more. Routing
 * the element through an AudioContext (done in v2/v3 for the volume fader,
 * EQ and the analyser) broke lock-screen playback: iOS suspends the
 * AudioContext when the phone locks, so the song kept "playing" in the UI
 * but went silent. A plain <audio> element plays on with the screen off,
 * which is what a music player is for. The EQ went with the graph; the
 * waveform animation now runs off the song's own stored peaks instead. */

/* ================= themes =================
 * 'green' = the Localify green. 'miku' = Hatsune Miku teal (#39c5bb) with
 * pink kept for hearts. The choice recolours the whole UI via the CSS
 * variables and the waveform via peakColor(). Saved between launches. */
const THEMES = ['green', 'miku', 'sonic', 'shadow', 'space', 'soundcloud', 'cdj', 'vapor', 'vinyl', 'dubstep'];
const THEME_NAMES = { green: 'Localify', miku: 'Hatsune Miku', sonic: 'Sonic', shadow: 'Shadow', space: 'Space', soundcloud: 'SoundCloud', cdj: 'CDJ', vapor: 'Vaporwave', vinyl: 'Vinyl', dubstep: 'Dubstep' };
const BUILD = '5.16';
let peakColorCache = {};
function applyTheme(name, save = true) {
  state.theme = THEMES.includes(name) ? name : 'green';
  document.documentElement.setAttribute('data-theme', state.theme);
  peakColorCache = {};
  document.querySelectorAll('#theme-chips .eqchip').forEach((c) =>
    c.classList.toggle('on', c.dataset.themeName === state.theme));
  if (save) saveMeta();
  if (!$('#player').classList.contains('hidden')) drawWave();
  dancerFrameKey = ''; drawDancer(); /* she changes with the theme */
}

/* Bar colour for a played waveform peak, by loudness — the look from
 * Gabriel's reference video: quiet bars violet/blue, mid bars cyan/green,
 * loud bars pink/red. In the Miku theme the same loudness scale runs
 * teal -> pale cyan -> Miku pink. Colours are cached per loudness step. */
const WAVE_STOPS = {
  miku:   [[57, 197, 187], [140, 240, 230], [255, 46, 136]],
  sonic:  [[47, 123, 255], [125, 211, 252], [255, 210, 63]],
  shadow: [[225, 6, 0], [255, 110, 64], [245, 197, 24]],
  space:  [[139, 124, 255], [125, 211, 252], [255, 183, 213]],
  soundcloud: [[122, 40, 0], [255, 85, 0], [255, 205, 150]],
  cdj:    [[6, 43, 77], [0, 150, 255], [207, 234, 255]],
  vapor:  [[91, 42, 157], [255, 113, 206], [255, 251, 150]],
  vinyl:  [[110, 68, 19], [232, 163, 61], [255, 237, 181]],
  dubstep: [[58, 16, 120], [168, 85, 247], [240, 171, 252]],
};
const WAVE_REST = { green: '#3d4a63', miku: '#46324a', sonic: '#26355c', shadow: '#3a2f28', space: '#262b52', soundcloud: '#2e2622', cdj: '#232a33', vapor: '#33204d', vinyl: '#33270f', dubstep: '#22103d' };
function peakColor(p) {
  const q = Math.round(Math.min(1, Math.max(0, p)) * 24);
  const key = state.theme + ':' + q;
  if (peakColorCache[key]) return peakColorCache[key];
  const t = q / 24;
  let c;
  const stops = WAVE_STOPS[state.theme];
  if (stops) {
    const seg = t < 0.55 ? 0 : 1, lt = t < 0.55 ? t / 0.55 : (t - 0.55) / 0.45;
    const a = stops[seg], b = stops[seg + 1];
    c = `rgb(${Math.round(a[0] + (b[0] - a[0]) * lt)},${Math.round(a[1] + (b[1] - a[1]) * lt)},${Math.round(a[2] + (b[2] - a[2]) * lt)})`;
  } else {
    c = `hsl(${Math.round((275 - t * 280 + 360) % 360)} 85% 60%)`;
  }
  peakColorCache[key] = c;
  return c;
}

/* Songs imported before waveforms existed get theirs computed lazily
   the first time they play (WAV only, sampled — see computeWavPeaks). */
async function ensurePeaks(song, file) {
  const hasPeaks = !!(song.peaks && song.peaks.length >= 480);
  const hasRms = !!(song.rms && song.rms.length >= 480);
  if ((hasPeaks && hasRms) || song._peaksBusy) return;
  if (!/\.wav$/i.test(song.fileName || '')) return;
  song._peaksBusy = true;
  try {
    const wp = await peaksForFile(file);
    if (wp) {
      if (!hasPeaks) song.peaks = wp.peaks;
      if (!hasRms) song.rms = wp.rms;
      DB.put('tracks', song).catch(() => {});
      if (song.id === state.currentId) drawWave();
    }
  } catch (e) { /* decorative only */ }
  song._peaksBusy = false;
}

/* ================= playback (one element, one URL, no decoding) ================= */
function currentSong() { return state.byId.get(state.currentId) || null; }

async function getPlayableFile(song) {
  if (sessionFiles.has(song.id)) return sessionFiles.get(song.id);
  if (!song.persisted) return null;
  if (song.audioKey) {
    try {
      const directory = await audioDirectory();
      const handle = await directory.getFileHandle(song.audioKey);
      const file = await handle.getFile();
      if (file.size === song.size) return song.mime ? file.slice(0, file.size, song.mime) : file;
    } catch (error) { console.warn('Stored audio could not be opened', error); }
  }
  const row = await DB.get('files', song.id).catch(() => null);
  if (row && row.blob) { sessionFiles.set(song.id, row.blob); return row.blob; }
  return null;
}

async function playSong(id, queue) {
  const song = state.byId.get(id);
  if (!song) return;
  /* Leaving a song: bank its listening time, and count an early
     skip when he bails before 80% after at least 10 s in. A song
     that ended on its own is never a skip. */
  const out = currentSong();
  if (out && out.id !== id) {
    flushListen();
    const od = out.duration || 0;
    if (od > 0 && !audio.ended && audio.currentTime >= 10 && audio.currentTime < od * 0.8) {
      out.skips = (out.skips || 0) + 1;
      DB.put('tracks', out).catch(() => {});
    }
  }
  if (queue) { state.queue = queue.map((s) => s.id); state.qIndex = state.queue.indexOf(id); }
  const token = ++playToken;
  const file = await getPlayableFile(song);
  if (token !== playToken) return;
  if (!file) {
    song.persisted = false; song.sessionOnly = true; song.needsFile = true; render();
    toast('“' + song.title + '” needs its audio file — tap + Add music and pick it again to play it');
    $('#file-input').click();
    return;
  }
  if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
  currentUrl = URL.createObjectURL(file);   /* native streaming playback; the file is never copied into JS memory */
  state.currentId = id;
  waveZoom = 1; waveZoomC = 0.5;
  audio.src = currentUrl;
  applyRate();
  /* Resume where this song left off (long mixes!). One-shot listener,
     token-guarded so a fast song switch can't seek the wrong track. */
  const resumeAt = song.pos > 5 ? song.pos : 0;
  if (resumeAt) {
    const onMeta = () => {
      audio.removeEventListener('loadedmetadata', onMeta);
      if (token === playToken && isFinite(audio.duration) && resumeAt < audio.duration - 10) {
        try { audio.currentTime = resumeAt; toast('Resumed at ' + fmtTime(resumeAt)); } catch (e) {}
      }
    };
    audio.addEventListener('loadedmetadata', onMeta);
  }
  wantPlay = true; interrupted = false;
  audio.play().catch(() => {});
  song.plays = (song.plays || 0) + 1;
  song.lastPlayed = Date.now();
  dayRec().plays++;
  state.history.unshift({ id: song.id, at: Date.now() });
  if (state.history.length > 200) state.history.length = 200;
  DB.put('tracks', song).catch(() => {});
  ensurePeaks(song, file);
  if (!song.bpm && /\.wav$/i.test(song.fileName || '')) {
    detectBpm(song, file).then((b) => {
      if (b && !song.bpm) {
        song.bpm = b;
        DB.put('tracks', song).catch(() => {});
        if (song.id === state.currentId) { renderDance(); toast('BPM detected: ' + b); }
      }
    }).catch(() => {});
  }
  saveMeta(); render(); updatePlayerUI();
}

function playAt(index) {
  if (!state.queue.length) return;
  const n = state.queue.length;
  const at = ((index % n) + n) % n;
  state.qIndex = at;
  playSong(state.queue[at]);
}
function next(auto) {
  if (!state.queue.length) return;
  if (auto && state.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  let at;
  if (state.shuffle && state.queue.length > 1) {
    do { at = Math.floor(Math.random() * state.queue.length); } while (at === state.qIndex);
  } else at = state.qIndex + 1;
  if (at >= state.queue.length) {
    if (auto && state.repeat !== 'all') { updatePlayerUI(); return; }
    at = 0;
  }
  playAt(at);
}
function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  playAt(state.qIndex - 1);
}

/* ================= waveform seek bar =================
 * WAV songs draw their REAL waveform (peaks computed at import by sampling
 * the PCM data — never decoded). Other formats get the original Localify
 * look: a smooth ribbon generated from the song's id (every song keeps its
 * own wave, like the Samsung-style player), flowing while it plays.
 * Either way: tap or drag on the wave to seek. */
function ribbonAmp(seedText, t, phase) {
  let hsh = 2166136261;
  const str = String(seedText || 'localify');
  for (let i = 0; i < str.length; i++) { hsh ^= str.charCodeAt(i); hsh = Math.imul(hsh, 16777619); }
  let seed = hsh >>> 0;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const p1 = rnd() * 6.28, p2 = rnd() * 6.28, p3 = rnd() * 6.28;
  const f1 = 2 + rnd() * 2, f2 = 5 + rnd() * 4, f3 = 11 + rnd() * 6;
  const env = 0.35 + 0.65 * Math.abs(Math.sin(t * Math.PI * (0.6 + f1 * 0.12) + p1));
  const w = Math.sin(t * f1 * 3.1 + p1 + phase) * 0.55 + Math.sin(t * f2 * 2.3 + p2 + phase * 1.5) * 0.3 + Math.sin(t * f3 * 1.7 + p3 + phase * 0.7) * 0.15;
  return Math.max(0.12, Math.min(1, 0.5 + w * 0.5)) * env;
}

const waveCv = $('#p-wave');
const wctx = waveCv.getContext('2d');
const scrollCv = $('#p-scroll');
/* MiniMeters-style scrolling waveform under the overview (Gabriel's
   pick): the last seconds of the song flow past a fixed playhead at the
   right edge — a filled silhouette in the SELECTED THEME's accent
   colour. For WAVs it is drawn from REAL samples read around the
   playhead (40 s windows, refreshed as playback moves), never from live
   audio routing, so lock-screen playback stays untouched. Other
   formats fall back to the overview peaks. */
const THEME_ACCENT = { green: '#1ed760', miku: '#39c5bb', sonic: '#2f7bff', shadow: '#e10600', space: '#8b7cff', soundcloud: '#ff5500', cdj: '#0096ff', vapor: '#ff71ce', vinyl: '#e8a33d', dubstep: '#a855f7' };
/* 3-band palettes for the scrolling strip, one per theme — the same
   3-step colour language as each theme's overview waveform stops. */
const THEME_BANDS = {
  green: { low: '#0e9e4a', mid: '#1ed760', high: '#ffb020' },
  miku: { low: '#1f8a80', mid: '#39c5bb', high: '#ff4d9d' },
  sonic: { low: '#0057d9', mid: '#7dd3fc', high: '#ffd23e' },
  shadow: { low: '#5a0d08', mid: '#e10600', high: '#f5c518' },
  space: { low: '#5b4bc4', mid: '#8b7cff', high: '#7dd3fc' },
  soundcloud: { low: '#7a2800', mid: '#ff5500', high: '#ffc46b' },
  cdj: { low: '#063a66', mid: '#0096ff', high: '#cfeaff' },
  vapor: { low: '#5b2a9d', mid: '#ff71ce', high: '#01cdfe' },
  vinyl: { low: '#6e4413', mid: '#e8a33d', high: '#ffedb5' },
  dubstep: { low: '#4c1d95', mid: '#a855f7', high: '#f0abfc' }
};
const SCROLL_SECONDS = 12;
let scrollCache = { id: null, start: 0, dur: 40, fine: null, busy: false, gen: 0 };
function interpArr(a, pos) {
  if (!a || !a.length) return 0;
  const i = Math.min(a.length - 1, Math.max(0, Math.floor(pos)));
  const fr = Math.min(1, Math.max(0, pos - i));
  const nx = a[Math.min(a.length - 1, i + 1)] || 0;
  return (a[i] || 0) * (1 - fr) + nx * fr;
}
function ensureScrollData(s, ct) {
  if (!s || !/\.wav$/i.test(s.fileName || '')) return;
  if (scrollCache.id !== s.id) scrollCache = { id: s.id, start: 0, dur: 40, fine: null, busy: false, gen: scrollCache.gen + 1 };
  const c = scrollCache;
  if (c.busy) {
    /* A window is already computing. Keep it only if it (or the fine
       data on screen) covers the playhead; a far seek abandons it via
       the generation counter — its checks discard the result — and the
       right window starts now instead of after the stale one. */
    if (c.fine && c.start <= ct && ct <= c.start + c.dur) return;
    const want0 = Math.max(0, Math.floor((ct - 16) / 4) * 4);
    if (c.pendingStart != null && Math.abs(want0 - c.pendingStart) <= 20) return;
    c.gen++;
  }
  if (c.fine && c.start <= ct - 13 && ct <= c.start + c.dur - 4) return;

    if (bits === 24) { let x = buf[o] | (buf[o + 1] << 8) | (buf[o + 2] << 16); if (x & 0x800000) x -= 0x1000000; return x / 8388608; }
    return view.getInt32(o, true) / 2147483648;
  };
  const CHUNK = 262144;
  let hopIdx = 0, sq = 0, sqN = 0, framePos = startFrame;
  while (framePos < endFrame && hopIdx < count) {
    const nFr = Math.min(CHUNK, endFrame - framePos);
    const buf = await r.read(info.dataStart + framePos * info.blockAlign, nFr * info.blockAlign);
    const got = Math.floor(buf.length / info.blockAlign);
    if (!got) break;
    const view = dv(buf);
    for (let fr = 0; fr < got && hopIdx < count; fr++) {
      let acc = 0;
      const base = fr * info.blockAlign;
      for (let c = 0; c < ch; c++) acc += sampleAt(view, buf, base + c * bps);
      const mono = acc / ch;
      if (((framePos + fr - startFrame) & 3) === 0) { sq += mono * mono; sqN++; }
      if (((framePos + fr - startFrame + 1) % hop) === 0) {
        env[hopIdx++] = Math.sqrt(sq / Math.max(1, sqN));
        sq = 0; sqN = 0;
      }
    }
    framePos += got;
    await tick();
  }
  return { values: env, hopSec: hop / sr, startSec: startFrame / sr };
}
/* Joint (period, phase) search over the onset flux: a tag that says 150
   when the track is really 150.4 would drift the grid a full beat over
   a long song, so the winner stores bpmExact alongside beatOffset. */
function beatPhaseFromEnvelope(env, hopSec, bpm, segStart) {
  /* env may be the envelope object or its values array; a typed array
     has a values() METHOD, so only an object-typed .values counts. */
  const src = (env && env.values && typeof env.values === 'object') ? env.values : env;
  if (!src || !src.length || !bpm) return null;
  const flux = new Float32Array(src.length);
  for (let i = 1; i < src.length; i++) flux[i] = Math.max(0, src[i] - src[i - 1]);
  let best = null;
  for (let mult = 0.985; mult <= 1.0151; mult += 0.0025) {
    const T = (60 / bpm) * mult, step = T / hopSec;
    const steps = Math.max(8, Math.round(step));
    for (let p = 0; p < steps; p++) {
      let sc = 0, n = 0;
      for (let t = p; t < flux.length; t += step) { sc += flux[Math.round(t)] || 0; n++; }
      if (n && (!best || sc / n > best.score)) best = { score: sc / n, phase: p * hopSec, period: T };
    }
  }
  if (!best) return null;
  const off = (segStart + best.phase) % best.period;
  return { beatOffset: Math.round(off * 1000) / 1000, bpmExact: Math.round((60 / best.period) * 100) / 100 };
}
async function detectBpm(song, file) {
  if (!song || song._bpmBusy) return 0;
  if (!/\.wav$/i.test(song.fileName || '')) return 0;
  song._bpmBusy = true;
  try {
    const f2 = file || await getPlayableFile(song);
    if (!f2) return 0;
    const r = new SliceReader(f2);
    const info = await parseWav(r);
    if (!info || !info.dataStart) return 0;
    const env = await wavEnergyEnvelope(r, info, 150);
    if (!env) return 0;
    const bpm = bpmFromEnvelope(env.values, env.hopSec);
    if (bpm) {
      const ph = beatPhaseFromEnvelope(env.values, env.hopSec, bpm, env.startSec || 0);
      if (ph) { song.beatOffset = ph.beatOffset; song.bpmExact = ph.bpmExact; }
    }
    return bpm;
  } catch (e) { return 0; }
  finally { song._bpmBusy = false; }
}

let waveSeeking = false;
function waveSeekTo(e) {
  const r = waveCv.getBoundingClientRect();
  const view = waveView();
  const f = view.v0 + Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (view.v1 - view.v0);
  if (isFinite(audio.duration) && audio.duration) {
    audio.currentTime = f * audio.duration;
    $('#p-cur').textContent = fmtTime(audio.currentTime);
    drawWave();
  }
}
waveCv.addEventListener('pointerdown', (e) => { waveSeeking = true; try { waveCv.setPointerCapture(e.pointerId); } catch (err) {} waveSeekTo(e); });
waveCv.addEventListener('pointermove', (e) => { if (waveSeeking) waveSeekTo(e); });
waveCv.addEventListener('pointerup', () => { waveSeeking = false; });
waveCv.addEventListener('pointercancel', () => { waveSeeking = false; });
/* Pinch to zoom the waveform (to 16x, around the pinch centre);
   double-tap resets. A pinch is not a seek. */
const wavePointers = new Map();
let pinchStart = null, lastWaveTap = 0;
waveCv.addEventListener('pointerdown', (e) => {
  wavePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (wavePointers.size === 2) {
    const pts = [...wavePointers.values()];
    pinchStart = { d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), zoom: waveZoom };
    waveSeeking = false;
  } else if (wavePointers.size === 1) {
    const now = performance.now();
    if (now - lastWaveTap < 350 && waveZoom > 1) { waveZoom = 1; waveZoomC = 0.5; drawWave(); }
    lastWaveTap = now;
  }
});
waveCv.addEventListener('pointermove', (e) => {
  if (!wavePointers.has(e.pointerId)) return;
  wavePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinchStart && wavePointers.size === 2) {
    const pts = [...wavePointers.values()];
    const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    if (d > 10 && pinchStart.d > 10) {
      const r = waveCv.getBoundingClientRect();
      const midF = Math.min(1, Math.max(0, ((pts[0].x + pts[1].x) / 2 - r.left) / r.width));
      const view = waveView();
      const frac = view.v0 + midF * (view.v1 - view.v0);
      setWaveZoom(pinchStart.zoom * d / pinchStart.d, frac, midF);
    }
  }
});
const wavePointerEnd = (e) => {
  wavePointers.delete(e.pointerId);
  if (wavePointers.size < 2) pinchStart = null;
};
waveCv.addEventListener('pointerup', wavePointerEnd);
waveCv.addEventListener('pointercancel', wavePointerEnd);

/* ================= duplicates (5.10) =================
 * Fingerprint = FNV-1a over a sample of the overview peaks plus the
 * rounded duration: a renamed copy of the same audio still matches.
 * Songs without peaks (never analysed) are skipped, not guessed. */
function songFingerprint(s) {
  if (!s || !s.peaks || !s.peaks.length) return null;
  let h = 2166136261;
  const step = Math.max(1, Math.floor(s.peaks.length / 64));
  for (let i = 0; i < s.peaks.length; i += step) { h ^= Math.round((s.peaks[i] || 0) * 255); h = Math.imul(h, 16777619); }
  return Math.round(s.duration || 0) + ':' + (h >>> 0).toString(16);
}
function openDuplicates() {
  const groups = new Map();
  for (const s of state.songs) {
    const fp = songFingerprint(s);
    if (!fp) continue;
    if (!groups.has(fp)) groups.set(fp, []);
    groups.get(fp).push(s);
  }
  const dupes = [...groups.values()].filter((g) => g.length > 1);
  sheetSongId = null;
  if (!dupes.length) {
    $('#sheet').innerHTML = `<h3>Duplicates</h3>
      <p class="sheetnote">No duplicate songs found. Songs are matched by their audio shape, so a renamed copy still counts. Songs without a waveform yet are not compared.</p>
      <button data-dupclose="1">Close</button>`;
  } else {
    let wasted = 0;
    const rows = dupes.map((g) => {
      wasted += g.slice(1).reduce((a, s) => a + (s.size || 0), 0);
      return g.map((s) => `<div class="duprow"><div class="dupmeta"><b>${esc(s.title)}</b><span>${esc(s.artist)} · ${fmtTime(s.duration)} · ${fmtSize(s.size)}</span></div><button data-dupremove="${esc(s.id)}">Remove</button></div>`).join('');
    }).join('<div class="dupsep"></div>');
    $('#sheet').innerHTML = `<h3>Duplicates</h3>
      <p class="sheetnote">${dupes.length} group${dupes.length === 1 ? '' : 's'} · removing the extra copies frees about ${fmtSize(wasted)}. Keep one of each.</p>
      ${rows}
      <button data-dupclose="1">Close</button>`;
  }
  $('#sheetWrap').classList.remove('hidden');
}
function openStats() {
  sheetSongId = null;
  const songs = state.songs;
  if (!songs.length) {
    $('#sheet').innerHTML = `<h3>Stats</h3>
      <p class="sheetnote">No songs in the library yet — add some music and the numbers show up here.</p>
      <button data-statsclose="1">Close</button>`;
    $('#sheetWrap').classList.remove('hidden');
    return;
  }
  const sum = (f) => songs.reduce((a, s) => a + (f(s) || 0), 0);
  const stored = songs.filter((s) => !s.sessionOnly).length;
  const playedSongs = songs.filter((s) => (s.plays || 0) > 0);
  const wav = songs.filter((s) => /\.wav$/i.test(s.fileName || '')).length;
  const longest = [...songs].sort((a, b) => (b.duration || 0) - (a.duration || 0))[0];
  const top = [...playedSongs].sort((a, b) => (b.plays || 0) - (a.plays || 0)).slice(0, 5);
  const recent = [...playedSongs].sort((a, b) => (b.lastPlayed || 0) - (a.lastPlayed || 0)).slice(0, 5);
  const mostListened = songs.filter((s) => (s.listenedSec || 0) > 0).sort((a, b) => (b.listenedSec || 0) - (a.listenedSec || 0)).slice(0, 5);
  const last7 = { plays: 0, sec: 0 };
  for (let i = 0; i < 7; i++) { const d = new Date(); d.setDate(d.getDate() - i); const r = state.dayStats[dayKey(d.getTime())]; if (r) { last7.plays += r.plays || 0; last7.sec += r.sec || 0; } }
  let streak = 0;
  { const d = new Date(); const t = state.dayStats[dayKey(d.getTime())]; if (!t || !t.plays) d.setDate(d.getDate() - 1);
    while (true) { const r = state.dayStats[dayKey(d.getTime())]; if (r && r.plays > 0) { streak++; d.setDate(d.getDate() - 1); } else break; } }
  const hist = (state.history || []).slice(0, 8).map((h) => ({ s: state.byId.get(h.id), at: h.at })).filter((x) => x.s);
  const today = state.dayStats[dayKey()] || { plays: 0, sec: 0 };
  const row = (k, v) => `<div class="statrow"><span>${k}</span><b>${v}</b></div>`;
  const listRow = (s, right) => `<div class="duprow"><div class="dupmeta"><b>${esc(s.title)}</b><span>${esc(s.artist)} · ${fmtTime(s.duration)}</span></div><b>${right}</b></div>`;
  const when = (ts) => new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ', ' + new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('#sheet').innerHTML = `<h3>Stats</h3>
    ${row('Songs', songs.length)}
    ${row('Total runtime', fmtTime(sum((s) => s.duration)))}
    ${row('Total size', fmtSize(sum((s) => s.size)))}
    ${row('Stored on this device', stored + ' of ' + songs.length)}
    ${row('Favorites', state.favorites.size)}
    ${row('Playlists', state.playlists.length)}
    ${row('Total plays', sum((s) => s.plays))}
    ${row('Total listening time', fmtTime(sum((s) => s.listenedSec)))}
    ${row('Completed plays', sum((s) => s.completions) + ' · skipped early: ' + sum((s) => s.skips))}
    ${row('Listening today', today.plays + ' plays · ' + fmtTime(today.sec))}
    ${row('Last 7 days', last7.plays + ' plays · ' + fmtTime(last7.sec))}
    ${row('Day streak', streak + (streak === 1 ? ' day' : ' days'))}
    ${row('Songs played', playedSongs.length + ' · never played: ' + (songs.length - playedSongs.length))}
    ${row('With BPM set', songs.filter((s) => s.bpm).length)}
    ${row('With beat grid', songs.filter((s) => s.beatOffset != null).length)}
    ${row('WAV files', wav + ' · other: ' + (songs.length - wav))}
    ${longest ? row('Longest song', esc(longest.title) + ' · ' + fmtTime(longest.duration)) : ''}
    ${top.length ? `<p class="statslabel">Most played</p>` + top.map((s) => listRow(s, (s.plays || 0) + (s.plays === 1 ? ' play' : ' plays'))).join('') : ''}
    ${recent.length ? `<p class="statslabel">Recently played</p>` + recent.map((s) => listRow(s, when(s.lastPlayed))).join('') : ''}
    ${mostListened.length ? `<p class="statslabel">Most listened</p>` + mostListened.map((s) => listRow(s, fmtTime(s.listenedSec))).join('') : ''}
    ${hist.length ? `<p class="statslabel">Play history</p>` + hist.map((x) => listRow(x.s, when(x.at))).join('') : ''}
    <button data-statsclose="1">Close</button>`;
  $('#sheetWrap').classList.remove('hidden');
}
