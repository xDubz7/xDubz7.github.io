<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a11">
<meta name="description" content="Localify Local - play your own music files on iPhone, offline. No YouTube, no streaming. Large WAV safe.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Localify">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Localify — Local Files</title>
<style>
:root{
  --bg:#070a11; --panel:#0e1320; --panel2:#141b2d; --line:#1f2a44;
  --text:#eef2fb; --dim:#93a1bd; --green:#1ed760; --green-d:#17b14f;
  --red:#ff5c5c; --amber:#ffb84d; --pink:#ff5c7a; --radius:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
/* Hatsune Miku theme — Gabriel's art direction (v4.3): TEAL leads (buttons,
   panels, progress, quiet waveform), and the TEXT goes hot pink. Secondary
   text stays soft teal; a thin pink banner strip under the header nods to
   his HiBy x Miku reference. */
[data-theme="miku"]{
  --bg:#050507; --panel:#0d0d12; --panel2:#17141f; --line:#2e2434;
  --text:#ff4d9d; --dim:#8fd0c8;
  --green:#39c5bb; --green-d:#1f9e94; --amber:#ffd166;
  --pink:#ff2e88; --pink-d:#d6006d;
}
[data-theme="miku"] header{border-bottom:2px solid var(--pink)}
[data-theme="miku"] .song.playing .title{color:var(--pink)}
/* Sonic the Hedgehog: hero blue leads (buttons, panels, progress), and —
   like Miku's pink — the TEXT and highlights are gold (his rings). */
[data-theme="sonic"]{
  --bg:#040814; --panel:#081226; --panel2:#0d1f3f; --line:#1c3560;
  --text:#ffd94d; --dim:#9db9e8;
  --green:#2f7bff; --green-d:#0057d9; --amber:#ffd23e;
  --pink:#ffd23e;
}
[data-theme="sonic"] header{border-bottom:2px solid var(--amber)}
[data-theme="sonic"] .song.playing .title{color:var(--amber)}
[data-theme="sonic"] .eqbars i{background:var(--amber)}
/* Shadow the Hedgehog: black, his red, and gold — same palette as the
   Gate Skipper Shadow theme. */
[data-theme="shadow"]{
  --bg:#050505; --panel:#0d0d0d; --panel2:#171717; --line:#2e2a26;
  --text:#f3ead8; --dim:#c9b896;
  --green:#e10600; --green-d:#9e0400; --amber:#f5c518;
  --pink:#f5c518;
}
[data-theme="shadow"] header{border-bottom:2px solid var(--pink)}
[data-theme="shadow"] .song.playing .title{color:var(--pink)}
[data-theme="shadow"] .eqbars i{background:var(--pink)}
/* Space: cosmic violet, starlight lavender text, aurora cyan accent —
   same palette as the Gate Skipper Space theme. */
[data-theme="space"]{
  --bg:#05060f; --panel:#0e1128; --panel2:#151a3d; --line:#232850;
  --dim:#c9c2ff;
  --green:#8b7cff; --green-d:#6a4fe0; --amber:#ffd166;
  --pink:#7dd3fc;
}
/* Every non-default theme uses its secondary accent (--pink) for
   favorite hearts and active transport toggles. */
[data-theme="miku"] .song .fav.on, [data-theme="sonic"] .song .fav.on,
/* SoundCloud: burnt orange on near-black (Gabriel's DJ platform). */
[data-theme="soundcloud"]{
  --bg:#0a0a0a; --panel:#131313; --panel2:#1c1c1c; --line:#2b2b2b;
  --dim:#a6a6a6;
  --green:#ff5500; --green-d:#d14400; --amber:#ffb38a;
  --pink:#ff8a50;
}
/* CDJ: deck grey/black with Pioneer blue. */
[data-theme="cdj"]{
  --bg:#0a0c0f; --panel:#11151b; --panel2:#1a2029; --line:#28303d;
  --dim:#93a5bd;
  --green:#0096ff; --green-d:#0076cc; --amber:#7dd3fc;
  --pink:#e8f4ff;
}
/* Vaporwave: deep purple, pink lead, cyan secondary, pale-yellow amber. */
[data-theme="vapor"]{
  --bg:#150826; --panel:#1f0b38; --panel2:#2a1150; --line:#3d2070;
  --text:#ffe9fb; --dim:#c9a6e8;
  --green:#ff71ce; --green-d:#d14ba8; --amber:#fffb96;
  --pink:#01cdfe;
}
/* Vinyl: warm amber/sepia on dark brown-black. */
[data-theme="vinyl"]{
  --bg:#16100a; --panel:#20180d; --panel2:#2b2011; --line:#3d2c15;
  --text:#f5e9cd; --dim:#bfa77e;
  --green:#e8a33d; --green-d:#bc7f24; --amber:#ffd98a;
  --pink:#d97b3f;
}
[data-theme="soundcloud"] .song .fav.on, [data-theme="cdj"] .song .fav.on,
[data-theme="vapor"] .song .fav.on, [data-theme="vinyl"] .song .fav.on{color:var(--pink)}
[data-theme="soundcloud"] .controls .pbtn.toggled, [data-theme="cdj"] .controls .pbtn.toggled,
[data-theme="vapor"] .controls .pbtn.toggled, [data-theme="vinyl"] .controls .pbtn.toggled{color:var(--pink)}
[data-theme="shadow"] .song .fav.on, [data-theme="space"] .song .fav.on{color:var(--pink)}
[data-theme="miku"] .controls .pbtn.toggled, [data-theme="sonic"] .controls .pbtn.toggled,
[data-theme="shadow"] .controls .pbtn.toggled, [data-theme="space"] .controls .pbtn.toggled{color:var(--pink)}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.hidden{display:none !important}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(7,10,17,.92);backdrop-filter:blur(10px);
  padding:calc(10px + var(--sat)) 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--green);color:#04140a;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px}
.brand small{display:block;color:var(--dim);font-size:11px;font-weight:500}
.addbtn{margin-left:auto;background:var(--green);color:#04140a;font-weight:700;
  padding:9px 14px;border-radius:999px;font-size:14px}
.addbtn:active{background:var(--green-d)}
.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:9px 14px;outline:none;font-size:15px}
.searchrow select{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:999px;padding:0 8px;font-size:13px;max-width:118px}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);font-size:13px}
.chip.on{background:var(--green);border-color:var(--green);color:#04140a;font-weight:700}

/* ---------- import bar ---------- */
#importbar{margin:12px 16px 0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px}
#importbar .row{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);gap:10px}
#importbar .row b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;background:var(--panel2);border-radius:99px;margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}

/* ---------- library ---------- */
main{padding:12px 12px calc(120px + var(--sab))}
.empty{margin:48px 20px;text-align:center;color:var(--dim);line-height:1.55}
.empty .big{font-size:40px;margin-bottom:10px}
.empty b{color:var(--text)}
.note{margin:14px 4px 0;font-size:12.5px;color:var(--dim);line-height:1.5;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.note b{color:var(--amber)}
.song{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:var(--radius)}
.song:active{background:var(--panel)}
.song.playing{background:var(--panel)}
.song .art{width:48px;height:48px;border-radius:10px;background:var(--panel2);flex:0 0 48px;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dim);overflow:hidden}
.song .art img{width:100%;height:100%;object-fit:cover}
.song .meta{flex:1;min-width:0}
.song .title{font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song.playing .title{color:var(--green)}
.song .sub{font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;
  background:#3a2b12;color:var(--amber);border:1px solid #6b4d15;font-weight:700}
.badge.off{background:#33161a;color:var(--red);border-color:#6b232a}
.song .fav{font-size:20px;color:var(--dim);padding:6px}
.song .fav.on{color:var(--green)}
.song .dots{font-size:20px;color:var(--dim);padding:6px 2px}

/* ---------- mini player ---------- */
#mini{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--sab));z-index:30;
  background:var(--panel2);border:1px solid var(--line);border-radius:16px;
  display:flex;align-items:center;gap:10px;padding:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#mini .art{width:42px;height:42px;border-radius:9px;background:var(--panel);flex:0 0 42px;
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--dim);overflow:hidden}
#mini .art img{width:100%;height:100%;object-fit:cover}
#mini .meta{flex:1;min-width:0}
#mini .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mini .sub{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.pbtn.main{background:var(--green);color:#04140a;font-size:19px}

/* ---------- full player ---------- */
#player{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding:calc(14px + var(--sat)) 22px calc(18px + var(--sab));display:flex;flex-direction:column}
#player>*{flex-shrink:0}
#player .close{align-self:flex-start;font-size:26px;color:var(--dim);padding:4px 8px}
#player .partwrap{position:relative;width:min(54vw,236px);height:min(54vw,236px);margin:10px auto}
#player .part{width:100%;height:100%;border-radius:18px;
  background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:84px;color:var(--dim);overflow:hidden}
#p-dancer{position:absolute;right:2px;bottom:0;height:104px;width:auto;display:block;pointer-events:none}
#player .part img{width:100%;height:100%;object-fit:cover}
#player h2{margin:8px 0 2px;font-size:21px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player .artist{text-align:center;color:var(--dim);font-size:15px;margin-bottom:4px}
#player .src{text-align:center;color:var(--dim);font-size:12px;margin-bottom:14px}
.seekrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.seekrow input{flex:1;accent-color:var(--green);height:28px}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.controls .pbtn.skip{width:44px;height:44px;font-size:12.5px;font-weight:700;color:var(--dim)}
#update-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(158px + var(--sab));z-index:61;
  background:var(--green);color:#04140a;font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);cursor:pointer;white-space:nowrap}
#update-pill .x{margin-left:10px;opacity:.65;font-weight:400}
.cuex{margin-left:7px;opacity:.6;font-weight:700}
.controls .pbtn{width:52px;height:52px;font-size:22px}
.controls .pbtn.main{width:66px;height:66px;font-size:27px}
.controls .pbtn.toggled{color:var(--green)}
.volrow{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--dim);font-size:14px}
.volrow input{flex:1;accent-color:var(--green)}

/* ---------- icons (SVG, no emoji buttons) ---------- */
.pbtn svg{display:block;width:24px;height:24px}
.pbtn.main svg{width:30px;height:30px}
#mini .pbtn svg{width:22px;height:22px}
#mini .prog{position:absolute;top:0;left:14px;right:14px;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
#mini .prog i{display:block;height:100%;width:0;background:var(--green)}
#mini{overflow:hidden}
.song .fav svg,.song .dots svg{display:block;width:22px;height:22px}
.song .art svg{width:22px;height:22px}
#mini .art svg{width:20px;height:20px}
#player .part svg{width:118px;height:118px}
#player .close svg{display:block;width:26px;height:26px}
.empty .big svg{width:52px;height:52px;color:var(--green)}
.chip svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.vic{display:flex}.vic svg{display:block;width:20px;height:20px}

/* ---------- playing-row EQ bars ---------- */
.eqbars{display:flex;align-items:flex-end;gap:2.5px;height:16px}
.eqbars i{display:block;width:3.5px;height:100%;background:var(--green);border-radius:2px;
  transform-origin:bottom;animation:eqb .9s ease-in-out infinite}
.eqbars i:nth-child(2){animation-delay:.22s}.eqbars i:nth-child(3){animation-delay:.45s}.eqbars i:nth-child(4){animation-delay:.12s}
.eqbars.still i{animation-play-state:paused;transform:scaleY(.35)}
@keyframes eqb{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

/* ---------- waveform seek ---------- */
#p-wave{flex:1;min-width:0;height:46px;touch-action:none;cursor:pointer}
#p-scroll{width:100%;height:54px;display:block;margin-top:8px}

/* ---------- player extras: sleep + EQ ---------- */
.eqrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.eqlab{color:var(--dim);font-size:13px;font-weight:700;letter-spacing:.06em}
.eqchips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
.eqchips::-webkit-scrollbar{display:none}
.eqchips .eqchip{flex:none}
.ptabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:14px}
.ptab{flex:1;padding:7px 0;border-radius:999px;color:var(--dim);font-size:13.5px;font-weight:600}
.ptab.on{background:var(--green);color:#04140a}
.prow{margin-top:10px}
.eqchip{padding:6px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);font-size:13px}
.eqchip.on{background:var(--green);border-color:var(--green);color:#04140a;font-weight:700}
.tdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);
  color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:21px;height:21px}
.extrarow{display:flex;justify-content:center;margin-top:12px}
.xbtn{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);font-size:13.5px}
.xbtn svg{display:block;width:18px;height:18px}
.xbtn.on{color:var(--green);border-color:var(--green)}

/* ---------- sheet / toast ---------- */
#sheetWrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
#sheet{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + var(--sab))}
#sheet h3{margin:4px 0 10px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet button{display:block;width:100%;text-align:left;padding:13px 6px;font-size:15.5px;border-bottom:1px solid var(--line)}
#sheet button:last-child{border-bottom:0}
#sheet button.danger{color:var(--red)}
/* ---------- playlist form ---------- */
#plWrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
#plsheet{background:var(--panel);width:100%;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + var(--sab))}
#plsheet h3{margin:4px 0 10px;font-size:16px}
#plsheet input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:12px 14px;outline:none;font-size:16px}
.plrow{display:flex;gap:10px;margin-top:12px}
.plrow button{flex:1;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:15px}
.plrow button.primary{background:var(--green);border-color:var(--green);color:#04140a;font-weight:700}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sab));z-index:60;
  background:#1c2740;border:1px solid var(--line);color:var(--text);font-size:14px;
  padding:10px 16px;border-radius:999px;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">L</div>
    <h1>Localify<small>Local files only · no YouTube · no streaming</small></h1>
    <button class="iconbtn" id="btn-theme" aria-label="Switch theme"></button>
    <button class="addbtn" id="btn-add">+ Add music</button>
  </div>
  <div class="searchrow">
    <input id="search" type="search" placeholder="Search your library…" autocomplete="off">
    <select id="sort" aria-label="Sort">
      <option value="title">Title A–Z</option>
      <option value="artist">Artist A–Z</option>
      <option value="recent">Recently added</option>
      <option value="size-desc">Largest first</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
</header>

<div id="importbar" class="hidden">
  <div class="row"><b id="ib-name">Adding music…</b><span id="ib-count">0 / 0</span></div>
  <div class="track"><i id="ib-fill"></i></div>
</div>

<main id="main"></main>

<div id="mini" class="hidden">
  <div class="prog"><i id="mini-prog-fill"></i></div>
  <div class="art" id="mini-art"></div>
  <div class="meta" id="mini-meta">
    <div class="title" id="mini-title">Nothing playing</div>
    <div class="sub" id="mini-sub">Pick a song to start</div>
  </div>
  <button class="pbtn" id="mini-prev" aria-label="Previous"></button>
  <button class="pbtn main" id="mini-play" aria-label="Play or pause"></button>
  <button class="pbtn" id="mini-next" aria-label="Next"></button>
</div>

<div id="player" class="hidden">
  <button class="close" id="p-close" aria-label="Close player"></button>
  <div class="partwrap"><div class="part" id="p-art"></div><canvas id="p-dancer" width="330" height="384"></canvas></div>
  <h2 id="p-title">Nothing playing</h2>
  <div class="artist" id="p-artist"></div>
  <div class="src" id="p-src">On this device</div>
  <div class="seekrow">
    <span id="p-cur">0:00</span>
    <canvas id="p-wave"></canvas>
    <span id="p-dur">0:00</span>
  </div>
  <canvas id="p-scroll"></canvas>
  <div class="controls">
    <button class="pbtn" id="p-shuffle" aria-label="Shuffle"></button>
    <button class="pbtn skip" id="p-back30" aria-label="Back 30 seconds">−30</button>
    <button class="pbtn" id="p-prev" aria-label="Previous"></button>
    <button class="pbtn main" id="p-play" aria-label="Play or pause"></button>
    <button class="pbtn" id="p-next" aria-label="Next"></button>
    <button class="pbtn skip" id="p-fwd30" aria-label="Forward 30 seconds">+30</button>
    <button class="pbtn" id="p-repeat" aria-label="Repeat"></button>
  </div>
  <div class="ptabs" id="p-tabs">
    <button data-ptab="theme" class="ptab on">Theme</button>
    <button data-ptab="speed" class="ptab">Speed</button>
    <button data-ptab="cues" class="ptab">Cues</button>
    <button data-ptab="dance" class="ptab">Dance</button>
  </div>
  <div class="eqrow prow" id="row-theme"><div class="eqchips" id="theme-chips">

/* ================= storage (metadata + small files only) ================= */
const DB = (() => {
  let p = null;

    if (p) return p;
    p = new Promise((resolve, reject) => {
      const req = indexedDB.open('localify-local', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        db.createObjectStore('tracks', { keyPath: 'id' });
        db.createObjectStore('files',  { keyPath: 'id' });
        db.createObjectStore('covers', { keyPath: 'id' });
        db.createObjectStore('meta',   { keyPath: 'key' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return p;
  }
  const wrap = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

    get:    async (n, k) => wrap((await store(n, 'readonly')).get(k)),
    getAll: async (n)    => wrap((await store(n, 'readonly')).getAll()),
    keys:   async (n)    => wrap((await store(n, 'readonly')).getAllKeys()),
    put:    async (n, v) => wrap((await store(n, 'readwrite')).put(v)),
    del:    async (n, k) => wrap((await store(n, 'readwrite')).delete(k)),
  };
})();

}

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function fmtSize(bytes) {
  if (!bytes) return '';
  const u = ['B', 'KB', 'MB', 'GB']; let n = bytes, i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }

 * Playlists, favorites, cues and resume positions live in this browser's
 * storage — clearing website data would wipe them. Export downloads one
 * JSON file keyed by file name + size (the same identity used to
 * re-attach session files); Import merges it back onto matching songs. */

  const data = { app: 'localify', kind: 'library-backup', version: 1, build: BUILD, exportedAt: new Date().toISOString(), playlists: [], songs: [] };

    data.songs.push({ key: songKey(s), fileName: s.fileName, size: s.size, title: s.title,
      favorite: state.favorites.has(s.id), cues: Array.isArray(s.cues) ? s.cues : [], pos: s.pos || 0, bpm: s.bpm || 0 });
  }

    keys: pl.ids.map((id) => { const s = state.byId.get(id); return s ? songKey(s) : null; }).filter(Boolean) }));

async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'localify' || !Array.isArray(data.songs)) { toast('That file is not a Localify backup'); return; }
    const byKey = new Map(state.songs.map((s) => [songKey(s), s]));
    let matched = 0;
    for (const entry of data.songs) {
      const s = byKey.get(entry.key); if (!s) continue;
      matched++;

      if (Array.isArray(entry.cues) && entry.cues.length) {
        const merged = Array.isArray(s.cues) ? [...s.cues] : [];
        for (const cu of entry.cues) if (!merged.some((x) => Math.abs(x.t - cu.t) < 2)) merged.push({ t: cu.t, label: cu.label || '' });

      if (entry.bpm >= 60 && entry.bpm <= 200 && !s.bpm) s.bpm = entry.bpm;

    for (const pl of data.playlists || []) {
      const ids = (pl.keys || []).map((k) => byKey.get(k)).filter(Boolean).map((s) => s.id);

      const existing = state.playlists.find((x) => x.name === pl.name);
      if (existing) { for (const id of ids) if (!existing.ids.includes(id)) existing.ids.push(id); }
      else state.playlists.push({ name: pl.name, ids });

function fileId(file) {
  const key = `${file.name}|${file.size}|${file.lastModified || 0}`;
  let h1 = 0xdeadbeef ^ key.length, h2 = 0x41c6ce57 ^ key.length;
  for (let i = 0; i < key.length; i++) {
    const ch = key.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);

const PAGE = 64 * 1024;
class SliceReader {
  constructor(blob) { this.blob = blob; this.size = blob.size; }

    len = Math.min(len, this.size - pos);

const u16le = (b, o) => b[o] | (b[o + 1] << 8);
const u32le = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;

async function parseWav(r) {

      if (startFrame >= frames) break;
      const pos = info.dataStart + startFrame * info.blockAlign;
      const len = Math.min(winFrames * info.blockAlign, info.dataLen - startFrame * info.blockAlign);
      if (len <= 0) continue;
      const buf = await r.read(pos, len);
      const view = dv(buf);
      for (let o = 0; o + bps <= buf.length; o += bps) {
        const v = Math.abs(sampleAt(view, buf, o));
        if (v > peak) peak = v;
      }
      if (peak >= 0.999) break;
    }
    peaks[b] = Math.round(Math.min(1, peak) * 1000) / 1000;
    if (b % 40 === 39) await tick();
  }
  return peaks;
}

/* Fine-grained peaks + 3-band levels for a short window (the scrolling strip): reads the
   actual PCM between t0 and t1 in chunks and returns `buckets` peak
   values. Chunked reads only — memory stays flat inside a 1.5 GB file. */
async function computeFinePeaks(r, info, t0, t1, buckets) {
  if (!info || !info.dataStart || !info.dataLen || !info.blockAlign || !info.sampleRate) return null;
  const bits = info.bitsPerSample || 0;
  const fmt = info.audioFormat || 1;
  if (!((fmt === 1 && (bits === 8 || bits === 16 || bits === 24 || bits === 32)) || (fmt === 3 && bits === 32))) return null;
  const bps = bits / 8;
  const ch = Math.max(1, Math.round(info.blockAlign / bps));
  const sr = info.sampleRate;
  const totalFrames = Math.floor(info.dataLen / info.blockAlign);
  const startFrame = Math.max(0, Math.floor(t0 * sr));
  const endFrame = Math.min(totalFrames, Math.ceil(t1 * sr));
  const out = new Float32Array(buckets);
  const bLow = new Float32Array(buckets), bMid = new Float32Array(buckets), bHigh = new Float32Array(buckets);
  if (endFrame <= startFrame) return { peaks: out, low: bLow, mid: bMid, high: bHigh };
  /* Cheap 3-band split riding the same decode pass: two one-pole
     low-passes (250 Hz / 4 kHz). low = lp250, mid = lp4k - lp250,
     high = signal - lp4k. No FFT, no extra reads. */
  const a1 = 1 - Math.exp((-2 * Math.PI * 250) / sr);
  const a2 = 1 - Math.exp((-2 * Math.PI * 4000) / sr);
  let lp1 = 0, lp2 = 0;
  const perBucket = (endFrame - startFrame) / buckets;
  const dv = (buf) => new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const sampleAt = (view, buf, o) => {
    if (fmt === 3) return view.getFloat32(o, true);
    if (bits === 16) return view.getInt16(o, true) / 32768;
    if (bits === 8) return (buf[o] - 128) / 128;
    if (bits === 24) { let x = buf[o] | (buf[o + 1] << 8) | (buf[o + 2] << 16); if (x & 0x800000) x -= 0x1000000; return x / 8388608; }
    return view.getInt32(o, true) / 2147483648;
  };
  const CHUNK = 262144;
  let framePos = startFrame;
  while (framePos < endFrame) {
    const n = Math.min(CHUNK, endFrame - framePos);
    const buf = await r.read(info.dataStart + framePos * info.blockAlign, n * info.blockAlign);
    const got = Math.floor(buf.length / info.blockAlign);
    if (!got) break;
    const view = dv(buf);
    for (let fr = 0; fr < got; fr++) {
      let acc = 0;
      const base = fr * info.blockAlign;
      for (let c = 0; c < ch; c++) acc += sampleAt(view, buf, base + c * bps);
      const mono = acc / ch;
      const v = Math.abs(mono);
      const b = Math.min(buckets - 1, Math.floor((framePos + fr - startFrame) / perBucket));
      if (v > out[b]) out[b] = v;
      lp1 += a1 * (mono - lp1);
      lp2 += a2 * (mono - lp2);
      const lv = Math.abs(lp1), mv = Math.abs(lp2 - lp1), hv = Math.abs(mono - lp2);
      if (lv > bLow[b]) bLow[b] = lv;
      if (mv > bMid[b]) bMid[b] = mv;
      if (hv > bHigh[b]) bHigh[b] = hv;
    }
    framePos += got;
    await tick();
  }
  return { peaks: out, low: bLow, mid: bMid, high: bHigh };
}

async function peaksForFile(file) {
  try {
    const r = new SliceReader(file);
    const info = await parseWav(r);
    return await computeWavPeaks(r, info);
  } catch (e) { return null; }
}

/* Minimal ID3v2 text frames (title/artist/album). No picture extraction
   for big files — a cover is never worth the memory. */
async function parseId3At(r, start) {
  const res = {};
  const h = await r.read(start, 10);
  if (h.length < 10 || txt(h, 0, 3) !== 'ID3') return res;
  const size = ((h[6] & 0x7f) << 21) | ((h[7] & 0x7f) << 14) | ((h[8] & 0x7f) << 7) | (h[9] & 0x7f);
  const body = await r.read(start + 10, Math.min(size, 512 * 1024));
  let o = 0;
  const frameSize = (b, p) => (h[3] >= 4)
    ? (((b[p] & 0x7f) << 21) | ((b[p + 1] & 0x7f) << 14) | ((b[p + 2] & 0x7f) << 7) | (b[p + 3] & 0x7f))
    : u32be(b, p);
  while (o + 10 <= body.length) {
    const id = txt(body, o, o + 4);
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const len = frameSize(body, o + 4);
    if (len <= 0 || o + 10 + len > body.length + 10) { /* truncated frame: stop */ }
    if ((id === 'TIT2' || id === 'TPE1' || id === 'TALB') && len > 1) {
      const enc = body[o + 10];
      const label = enc === 3 ? 'utf-8' : enc === 1 ? 'utf-16' : enc === 2 ? 'utf-16be' : 'windows-1252';
      const v = txt(body, o + 11, o + 10 + len, label).replace(/\0+$/g, '').trim();
      if (id === 'TIT2') res.title = v; else if (id === 'TPE1') res.artist = v; else res.album = v;
    }
    o += 10 + len;
  }
  return res;
}

/* FLAC duration from STREAMINFO (first block only). */
async function parseFlac(r) {
  const h = await r.read(0, 8);
  if (txt(h, 0, 4) !== 'fLaC') throw new Error('not flac');
  const blockLen = (h[5] << 16) | (h[6] << 8) | h[7];
  const b = await r.read(8, Math.min(blockLen, 34));
  if (b.length < 34) return {};
  const sampleRate = (b[10] << 12) | (b[11] << 4) | (b[12] >> 4);
  const totalSamples = Number((BigInt(b[13] & 0x0f) << 32n) |
    BigInt((b[14] << 24) | (b[15] << 16) | (b[16] << 8) | b[17]));
  return { duration: sampleRate && totalSamples ? totalSamples / sampleRate : 0 };
}

/* Duration via the browser's own metadata load — it streams headers,
   it does not hand the file to JS. Used only when no header duration. */
function probeDuration(file) {
  return new Promise((resolve) => {
    const a = new Audio();
    const url = URL.createObjectURL(file);
    let done = false;
    const finish = (d) => { if (done) return; done = true; URL.revokeObjectURL(url); a.removeAttribute('src'); resolve(isFinite(d) && d > 0 ? d : 0); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => finish(a.duration);
    a.onerror = () => finish(0);
    setTimeout(() => finish(a.duration || 0), 8000);
    a.src = url;
  });
}

async function readTags(file) {
  const r = new SliceReader(file);
  const lower = file.name.toLowerCase();
  let info = {};
  try {
    if (lower.endsWith('.wav') || lower.endsWith('.aif') || lower.endsWith('.aiff')) {
      info = await parseWav(r);
      if (lower.endsWith('.wav') && info.dataStart) {
        try { info.peaks = await computeWavPeaks(r, info); } catch (e) { /* peaks are decorative */ }
      }
    }
    else if (lower.endsWith('.flac')) info = await parseFlac(r);
    else if (lower.endsWith('.mp3')) info = await parseId3At(r, 0);
  } catch (e) { info = {}; }
  let duration = info.duration || 0;
  if (!duration) duration = await probeDuration(file);
  return {
    title: (info.title || '').trim() || cleanName(file.name) || 'Untitled',
    artist: (info.artist || '').trim() || 'Unknown Artist',
    album: (info.album || '').trim() || '',
    duration: Math.round((duration || 0) * 10) / 10,
    peaks: info.peaks || null,
  };
}

/* ================= import ================= */
function renderImport() {
  const bar = $('#importbar');
  if (!state.importing) { bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const { done, total, name } = state.importing;
  $('#ib-name').textContent = 'Adding: ' + (name || '');
  $('#ib-count').textContent = done + ' / ' + total;
  $('#ib-fill').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
}

async function importOneFile(file) {
  const id = fileId(file);
  /* Re-attach: a saved record (e.g. a session-only large file from a
     previous visit) with the same name+size gets its file back. */
  let existing = state.byId.get(id);
  if (!existing) {
    existing = state.songs.find((s) => s.needsFile && s.fileName === file.name && s.size === file.size);
  }
  if (existing) {
    sessionFiles.set(existing.id, file);
    if (existing.needsFile) {
      existing.needsFile = false;
      /* If it is small enough to keep after all, store it now. */
      if (file.size < PERSIST_LIMIT && !existing.persisted) {
        try { await DB.put('files', { id: existing.id, blob: file }); existing.persisted = true; } catch (e) { /* session-only then */ }
      }
      await DB.put('tracks', existing).catch(() => {});
      render();
    }
    return 'attached';
  }
  const info = await readTags(file);
  const large = file.size >= PERSIST_LIMIT;
  const record = {
    id, title: info.title, artist: info.artist, album: info.album,
    duration: info.duration, size: file.size, mime: file.type || '',
    fileName: file.name, addedAt: Date.now(), peaks: info.peaks || null,
    persisted: false, sessionOnly: large, needsFile: false,
  };
  if (!large) {
    try { await DB.put('files', { id, blob: file }); record.persisted = true; }
    catch (e) { record.sessionOnly = true; /* storage full/refused: keep it for this session */ }
  }
  sessionFiles.set(id, file);
  /* Storage must NEVER block an import: on hosts where IndexedDB is
     unavailable or partitioned (e.g. inside another site's frame), the
     DB write rejects — the song still plays fine from memory for this
     session, so a failed write only means "not saved for next visit". */
  try { await DB.put('tracks', record); }
  catch (e) { record.sessionOnly = true; console.warn('Track metadata not saved (storage unavailable); playing for this session', e); }
  state.songs.push(record);
  state.byId.set(id, record);
  return large ? 'large' : 'added';
}

async function importFiles(fileList) {
  const files = Array.from(fileList || []).filter((f) => f && (AUDIO_EXT.test(f.name) || String(f.type || '').startsWith('audio/')));
  if (!files.length) { toast('No audio files in that selection'); return; }
  if (state.importing) { toast('Still adding — one moment'); return; }
  state.importing = { done: 0, total: files.length, name: files[0].name };
  renderImport();
  let added = 0, large = 0, attached = 0, failed = 0;
  for (const file of files) {
    state.importing.name = file.name; renderImport();
    try {
      const out = await importOneFile(file);
      if (out === 'added') added++; else if (out === 'large') large++;
      else if (out === 'attached') attached++;
    } catch (e) { failed++; console.warn('Could not import', file.name, e); }
    state.importing.done++; renderImport();
    await tick(); /* let Safari breathe between files */
  }
  state.importing = null; renderImport(); render();
  const bits = [];
  if (added) bits.push(added + ' added');
  if (large) bits.push(large + ' large file' + (large > 1 ? 's' : '') + ' added for this session');
  if (attached) bits.push(attached + ' re-attached');
  if (failed) bits.push(failed + ' failed');
  toast(bits.join(' · ') || 'Nothing new to add');
  if (large) setTimeout(() => toast('Large files (over ' + fmtSize(PERSIST_LIMIT) + ') play for this session only — Safari can’t store them. Re-add the file next visit and it re-attaches.'), 3600);
}

/* ================= library rendering ================= */
function visibleSongs() {
  let list = state.songs.slice();
  if (state.filter === 'fav') list = list.filter((s) => state.favorites.has(s.id));
  else if (state.filter.startsWith('pl:')) {
    const pl = state.playlists[Number(state.filter.slice(3))];
    if (pl) { const set = new Set(pl.ids); list = list.filter((s) => set.has(s.id)); }
  }
  if (state.query) {
    const q = state.query.toLowerCase();
    list = list.filter((s) => (s.title + ' ' + s.artist + ' ' + s.album + ' ' + s.fileName).toLowerCase().includes(q));
  }
  const by = state.sort;
  list.sort((a, b) =>
    by === 'artist' ? (a.artist + a.title).localeCompare(b.artist + b.title) :
    by === 'recent' ? (b.addedAt || 0) - (a.addedAt || 0) :
    by === 'size-desc' ? (b.size || 0) - (a.size || 0) :
    a.title.localeCompare(b.title));
  return list;
}

function renderChips() {
  const chips = [{ k: 'all', label: 'All songs' }, { k: 'fav', label: 'Favorites', ic: 'heartFill' }];
  state.playlists.forEach((pl, i) => chips.push({ k: 'pl:' + i, label: pl.name }));
  chips.push({ k: '__newpl', label: '+ Playlist' });
  chips.push({ k: '__backup', label: 'Export backup' });
  chips.push({ k: '__restore', label: 'Import backup' });
  $('#chips').innerHTML = chips.map((c) =>
    `<button class="chip ${state.filter === c.k ? 'on' : ''}" data-chip="${esc(c.k)}">${c.ic ? icon(c.ic) : ''}${esc(c.label)}</button>`).join('');
}

function render() {
  renderChips();
  const main = $('#main');
  const list = visibleSongs();
  if (!state.songs.length) {
    main.innerHTML = `<div class="empty"><div class="big">${icon('note')}</div>
      <b>Your library is empty</b><br>Tap <b>+ Add music</b> and pick songs from Files
      (MP3, FLAC, WAV, M4A…). They play right here — offline, no account, no YouTube.
      <div class="note"><b>Big WAVs welcome:</b> files over ${fmtSize(PERSIST_LIMIT)} (your 600 MB / 1.5 GB ones)
      are played directly without being copied into the browser, which is what crashed Safari before.
      They stay playable until you close the page; re-adding the same file later re-attaches it to its saved entry.</div></div>`;
    return;
  }
  if (!list.length) {
    main.innerHTML = `<div class="empty">Nothing matches here.</div>`;
    return;
  }
  main.innerHTML = list.map((s) => {
    const playing = s.id === state.currentId;
    const badge = s.needsFile ? `<span class="badge off">re-add file</span>`
      : s.sessionOnly ? `<span class="badge">session only · ${fmtSize(s.size)}</span>` : '';
    const art = playing
      ? `<span class="eqbars${audio.paused ? ' still' : ''}"><i></i><i></i><i></i><i></i></span>`
      : icon('note');
    return `<div class="song ${playing ? 'playing' : ''}" data-play="${esc(s.id)}">
      <div class="art">${art}</div>
      <div class="meta">
        <div class="title">${esc(s.title)}${badge}</div>
        <div class="sub">${esc(s.artist)}${s.album ? ' · ' + esc(s.album) : ''} · ${fmtTime(s.duration)} · ${fmtSize(s.size)}${s.pos > 5 ? ' · resume at ' + fmtTime(s.pos) : ''}</div>
      </div>
      <button class="fav ${state.favorites.has(s.id) ? 'on' : ''}" data-fav="${esc(s.id)}" aria-label="Favorite">${icon(state.favorites.has(s.id) ? 'heartFill' : 'heart')}</button>
      <button class="dots" data-menu="${esc(s.id)}" aria-label="More">${icon('dots')}</button>
    </div>`;
  }).join('');
}

/* ================= playback path note =================
 * NOTE (v4): there is deliberately NO Web Audio routing any more. Routing
 * the element through an AudioContext (done in v2/v3 for the volume fader,
 * EQ and the analyser) broke lock-screen playback: iOS suspends the
 * AudioContext when the phone locks, so the song kept "playing" in the UI
 * but went silent. A plain <audio> element plays on with the screen off,
 * which is what a music player is for. The EQ went with the graph; the
 * waveform animation now runs off the song's own stored peaks instead. */

/* ================= themes =================
 * 'green' = the Localify green. 'miku' = Hatsune Miku teal (#39c5bb) with
 * pink kept for hearts. The choice recolours the whole UI via the CSS
 * variables and the waveform via peakColor(). Saved between launches. */
const THEMES = ['green', 'miku', 'sonic', 'shadow', 'space', 'soundcloud', 'cdj', 'vapor', 'vinyl'];
const THEME_NAMES = { green: 'Localify', miku: 'Hatsune Miku', sonic: 'Sonic', shadow: 'Shadow', space: 'Space', soundcloud: 'SoundCloud', cdj: 'CDJ', vapor: 'Vaporwave', vinyl: 'Vinyl' };
const BUILD = '5.2';
let peakColorCache = {};
function applyTheme(name, save = true) {
  state.theme = THEMES.includes(name) ? name : 'green';
  document.documentElement.setAttribute('data-theme', state.theme);
  peakColorCache = {};
  document.querySelectorAll('#theme-chips .eqchip').forEach((c) =>
    c.classList.toggle('on', c.dataset.themeName === state.theme));
  if (save) saveMeta();
  if (!$('#player').classList.contains('hidden')) drawWave();
}

/* Bar colour for a played waveform peak, by loudness — the look from
 * Gabriel's reference video: quiet bars violet/blue, mid bars cyan/green,
 * loud bars pink/red. In the Miku theme the same loudness scale runs
 * teal -> pale cyan -> Miku pink. Colours are cached per loudness step. */
const WAVE_STOPS = {
  miku:   [[57, 197, 187], [140, 240, 230], [255, 46, 136]],
  sonic:  [[47, 123, 255], [125, 211, 252], [255, 210, 63]],
  shadow: [[225, 6, 0], [255, 110, 64], [245, 197, 24]],
  space:  [[139, 124, 255], [125, 211, 252], [255, 183, 213]],
  soundcloud: [[122, 40, 0], [255, 85, 0], [255, 205, 150]],
  cdj:    [[6, 43, 77], [0, 150, 255], [207, 234, 255]],
  vapor:  [[91, 42, 157], [255, 113, 206], [255, 251, 150]],
  vinyl:  [[110, 68, 19], [232, 163, 61], [255, 237, 181]],
};
const WAVE_REST = { green: '#3d4a63', miku: '#46324a', sonic: '#26355c', shadow: '#3a2f28', space: '#262b52', soundcloud: '#2e2622', cdj: '#232a33', vapor: '#33204d', vinyl: '#33270f' };
function peakColor(p) {
  const q = Math.round(Math.min(1, Math.max(0, p)) * 24);
  const key = state.theme + ':' + q;
  if (peakColorCache[key]) return peakColorCache[key];
  const t = q / 24;
  let c;
  const stops = WAVE_STOPS[state.theme];
  if (stops) {
    const seg = t < 0.55 ? 0 : 1, lt = t < 0.55 ? t / 0.55 : (t - 0.55) / 0.45;
    const a = stops[seg], b = stops[seg + 1];
    c = `rgb(${Math.round(a[0] + (b[0] - a[0]) * lt)},${Math.round(a[1] + (b[1] - a[1]) * lt)},${Math.round(a[2] + (b[2] - a[2]) * lt)})`;
  } else {
    c = `hsl(${Math.round((275 - t * 280 + 360) % 360)} 85% 60%)`;
  }
  peakColorCache[key] = c;
  return c;
}

/* Songs imported before waveforms existed get theirs computed lazily
   the first time they play (WAV only, sampled — see computeWavPeaks). */
async function ensurePeaks(song, file) {
  if ((song.peaks && song.peaks.length >= 480) || song._peaksBusy) return;
  if (!/\.wav$/i.test(song.fileName || '')) return;
  song._peaksBusy = true;
  try {
    const peaks = await peaksForFile(file);
    if (peaks) {
      song.peaks = peaks;
      DB.put('tracks', song).catch(() => {});
      if (song.id === state.currentId) drawWave();
    }
  } catch (e) { /* decorative only */ }
  song._peaksBusy = false;
}

/* ================= playback (one element, one URL, no decoding) ================= */
function currentSong() { return state.byId.get(state.currentId) || null; }

async function getPlayableFile(song) {
  if (sessionFiles.has(song.id)) return sessionFiles.get(song.id);
  if (!song.persisted) return null;
  const row = await DB.get('files', song.id).catch(() => null);
  if (row && row.blob) { sessionFiles.set(song.id, row.blob); return row.blob; }
  return null;
}

async function playSong(id, queue) {
  const song = state.byId.get(id);
  if (!song) return;
  if (queue) { state.queue = queue.map((s) => s.id); state.qIndex = state.queue.indexOf(id); }
  const token = ++playToken;
  const file = await getPlayableFile(song);
  if (token !== playToken) return;
  if (!file) {
    song.needsFile = true; render();
    toast('“' + song.title + '” is a large/session file — tap + Add music and pick it again to play it');
    $('#file-input').click();
    return;
  }
  if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
  currentUrl = URL.createObjectURL(file);   /* native streaming playback; the file is never copied into JS memory */
  state.currentId = id;
  audio.src = currentUrl;
  applyRate();
  /* Resume where this song left off (long mixes!). One-shot listener,
     token-guarded so a fast song switch can't seek the wrong track. */
  const resumeAt = song.pos > 5 ? song.pos : 0;
  if (resumeAt) {
    const onMeta = () => {
      audio.removeEventListener('loadedmetadata', onMeta);
      if (token === playToken && isFinite(audio.duration) && resumeAt < audio.duration - 10) {
        try { audio.currentTime = resumeAt; toast('Resumed at ' + fmtTime(resumeAt)); } catch (e) {}
      }
    };
    audio.addEventListener('loadedmetadata', onMeta);
  }
  audio.play().catch(() => {});
  ensurePeaks(song, file);
  saveMeta(); render(); updatePlayerUI();
}

function playAt(index) {
  if (!state.queue.length) return;
  const n = state.queue.length;
  const at = ((index % n) + n) % n;
  state.qIndex = at;
  playSong(state.queue[at]);
}
function next(auto) {
  if (!state.queue.length) return;
  if (auto && state.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  let at;
  if (state.shuffle && state.queue.length > 1) {
    do { at = Math.floor(Math.random() * state.queue.length); } while (at === state.qIndex);
  } else at = state.qIndex + 1;
  if (at >= state.queue.length) {
    if (auto && state.repeat !== 'all') { updatePlayerUI(); return; }
    at = 0;
  }
  playAt(at);
}
function prev() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  playAt(state.qIndex - 1);
}

/* ================= waveform seek bar =================
 * WAV songs draw their REAL waveform (peaks computed at import by sampling
 * the PCM data — never decoded). Other formats get the original Localify
 * look: a smooth ribbon generated from the song's id (every song keeps its
 * own wave, like the Samsung-style player), flowing while it plays.
 * Either way: tap or drag on the wave to seek. */
function ribbonAmp(seedText, t, phase) {
  let hsh = 2166136261;
  const str = String(seedText || 'localify');
  for (let i = 0; i < str.length; i++) { hsh ^= str.charCodeAt(i); hsh = Math.imul(hsh, 16777619); }
  let seed = hsh >>> 0;
  const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const p1 = rnd() * 6.28, p2 = rnd() * 6.28, p3 = rnd() * 6.28;
  const f1 = 2 + rnd() * 2, f2 = 5 + rnd() * 4, f3 = 11 + rnd() * 6;

const DANCER_ROWS = 2, DANCER_COLS = 8, DANCER_CW = 110, DANCER_CH = 128;
const DANCER_DEFAULT_BPM = 145; /* riddim lives at 140–150 */
const dancerImg = new Image();
dancerImg.src = DANCER_DATA;
const dancerCv = $('#p-dancer');
let dancerFrameKey = '';
function songBpm(s) {
  const b = Number(s && s.bpm);
  return b >= 60 && b <= 200 ? b : DANCER_DEFAULT_BPM;
}
function drawDancer() {
  if (!dancerCv) return;
  const s = currentSong();
  const show = state.dancer !== false && !!s;
  dancerCv.style.display = show ? 'block' : 'none';
  if (!show || !dancerImg.complete || !dancerImg.naturalWidth) return;
  let frame = 0, row = 0;
  if (!audio.paused && !audio.ended) {
    const beats = audio.currentTime * songBpm(s) / 60;
    frame = Math.floor(beats * 2) % DANCER_COLS;
    row = Math.floor(beats / 16) % DANCER_ROWS;
  }
  const key = row + ':' + frame;
  if (key === dancerFrameKey) return;
  dancerFrameKey = key;
  const ctx = dancerCv.getContext('2d');
  ctx.clearRect(0, 0, dancerCv.width, dancerCv.height);
  ctx.drawImage(dancerImg, frame * DANCER_CW, row * DANCER_CH, DANCER_CW, DANCER_CH,
    0, 0, dancerCv.width, dancerCv.height);
}
dancerImg.addEventListener('load', () => { dancerFrameKey = ''; drawDancer(); });
function renderDance() {
  const val = $('#bpm-val'); if (!val) return;
  const s = currentSong();
  const custom = !!(s && Number(s.bpm) >= 60 && Number(s.bpm) <= 200);
  val.textContent = songBpm(s) + ' BPM' + (custom ? '' : ' · default');
  const tog = $('#dancer-toggle');
  tog.textContent = state.dancer === false ? 'Dancer off' : 'Dancer on';
  tog.classList.toggle('on', state.dancer !== false);
  document.querySelectorAll('#dance-chips [data-bpm-preset]').forEach((ch) =>
    ch.classList.toggle('on', custom && Number(ch.dataset.bpmPreset) === songBpm(s)));
}
function setBpm(v) {
  const s = currentSong();
  if (!s) { toast('Play a song first, then set its BPM'); return; }
  s.bpm = Math.min(200, Math.max(60, Math.round(v * 10) / 10));
  DB.put('tracks', s).catch(() => {});
  renderDance(); dancerFrameKey = ''; drawDancer();
}
$('#dancer-toggle').addEventListener('click', () => {
  state.dancer = state.dancer === false;
  saveMeta(); renderDance(); drawDancer();
});
$('#bpm-down').addEventListener('click', () => setBpm(songBpm(currentSong()) - 1));
$('#bpm-up').addEventListener('click', () => setBpm(songBpm(currentSong()) + 1));
$('#dance-chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-bpm-preset]');
  if (b) setBpm(Number(b.dataset.bpmPreset));
});
let tapTimes = [];
$('#bpm-tap').addEventListener('click', () => {
  const now = performance.now();
  tapTimes = tapTimes.filter((t) => now - t < 2500);
  tapTimes.push(now);
  if (tapTimes.length >= 3) {
    const span = (tapTimes[tapTimes.length - 1] - tapTimes[0]) / (tapTimes.length - 1);
    setBpm(60000 / span);
    toast('BPM set from your tapping: ' + songBpm(currentSong()));
  } else {
    toast('Keep tapping on the beat…');
  }
});

/* Heal thyself: after the app resumes or rotates, force a fresh draw —
   a stale geometry frame should never survive into normal use. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !$('#player').classList.contains('hidden')) { drawWave(); kickWave(); }
});
window.addEventListener('resize', () => {
  if (!$('#player').classList.contains('hidden')) drawWave();
});
let waveSeeking = false;
function waveSeekTo(e) {
  const r = waveCv.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if (isFinite(audio.duration) && audio.duration) {
    audio.currentTime = f * audio.duration;
    $('#p-cur').textContent = fmtTime(audio.currentTime);
    drawWave();
  }
}
waveCv.addEventListener('pointerdown', (e) => { waveSeeking = true; try { waveCv.setPointerCapture(e.pointerId); } catch (err) {} waveSeekTo(e); });
waveCv.addEventListener('pointermove', (e) => { if (waveSeeking) waveSeekTo(e); });
waveCv.addEventListener('pointerup', () => { waveSeeking = false; });
waveCv.addEventListener('pointercancel', () => { waveSeeking = false; });

/* ================= player UI ================= */
function updatePlayerUI() {
  const s = currentSong();
  const playing = !audio.paused && !audio.ended && !!s;
  $('#mini').classList.toggle('hidden', !s);
  if (!s) return;
  $('#mini-title').textContent = s.title;
  $('#mini-sub').textContent = s.artist + (s.sessionOnly ? ' · session file' : '');
  const playIcon = icon(playing ? 'pause' : 'play');
  $('#mini-play').innerHTML = playIcon; $('#p-play').innerHTML = playIcon;
  $('#p-title').textContent = s.title;
  $('#p-artist').textContent = s.artist + (s.album ? ' — ' + s.album : '');
  $('#p-src').textContent = 'On this device · ' + fmtSize(s.size) + (s.sessionOnly ? ' · plays for this session (not stored)' : ' · stored on this device');
  renderCues(); renderDance();
  $('#p-shuffle').classList.toggle('toggled', state.shuffle);
  $('#p-repeat').classList.toggle('toggled', state.repeat !== 'off');
  $('#p-repeat').innerHTML = icon(state.repeat === 'one' ? 'repeatOne' : 'repeat');
  if (!$('#player').classList.contains('hidden')) { drawWave(); kickWave(); }
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: s.title, artist: s.artist, album: s.album || '',
      });
      navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
    } catch (e) { /* ignore */ }
  }
  render();
}

/* ================= playlist form (no prompt(): dialogs are blocked in some embedded frames) ================= */
function showPlForm() {
  $('#plWrap').classList.remove('hidden');
  const inp = $('#pl-name'); inp.value = '';
  setTimeout(() => inp.focus(), 60);
}
function hidePlForm() { $('#plWrap').classList.add('hidden'); }
function createPlFromForm() {
  const name = $('#pl-name').value.trim();
  if (!name) { hidePlForm(); return; }
  state.playlists.push({ name, ids: [] });
  state.filter = 'pl:' + (state.playlists.length - 1);
  saveMeta(); hidePlForm(); render();
}

/* ================= song menu ================= */
let sheetSongId = null;
function openMenu(id) {
  sheetSongId = id;
  const s = state.byId.get(id); if (!s) return;
  const plBtns = state.playlists.map((pl, i) =>
    `<button data-act="addpl" data-pl="${i}">Add to “${esc(pl.name)}”</button>`).join('');
  $('#sheet').innerHTML = `<h3>${esc(s.title)}</h3>
    <button data-act="play">Play</button>
    <button data-act="fav">${state.favorites.has(id) ? 'Remove from Favorites' : 'Add to Favorites'}</button>
    ${plBtns}
    <button data-act="remove" class="danger">Remove from library</button>
    <button data-act="cancel">Cancel</button>`;
  $('#sheetWrap').classList.remove('hidden');
}
function closeMenu() { $('#sheetWrap').classList.add('hidden'); sheetSongId = null; }

async function removeSong(id) {
  const s = state.byId.get(id); if (!s) return;
  if (state.currentId === id) { audio.pause(); audio.removeAttribute('src'); if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; } state.currentId = null; }
  sessionFiles.delete(id);
  state.songs = state.songs.filter((x) => x.id !== id);
  state.byId.delete(id);
  state.favorites.delete(id);
  state.playlists.forEach((pl) => { pl.ids = pl.ids.filter((x) => x !== id); });
  await DB.del('tracks', id).catch(() => {});
  await DB.del('files', id).catch(() => {});
  await DB.del('covers', id).catch(() => {});
  saveMeta(); render(); updatePlayerUI();
  toast('Removed “' + s.title + '” (your original file in Files is untouched)');
}

  'p-prev': 'prev', 'p-play': 'play', 'p-next': 'next',
  'p-shuffle': 'shuffle', 'p-repeat': 'repeat', 'p-close': 'chevD',
  'mini-art': 'note', 'p-art': 'note', 'btn-theme': 'palette',
};
for (const id in FILL_ICONS) { const el = document.getElementById(id); if (el) el.innerHTML = icon(FILL_ICONS[id]); }
$('#btn-add').addEventListener('click', () => $('#file-input').click());
$('#file-input').addEventListener('change', (e) => { importFiles(e.target.files); e.target.value = ''; });
$('#search').addEventListener('input', (e) => { state.query = e.target.value.trim(); render(); });
$('#sort').addEventListener('change', (e) => { state.sort = e.target.value; saveMeta(); render(); });

$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-chip]'); if (!b) return;
  const k = b.dataset.chip;
  if (k === '__newpl') { showPlForm(); return; }
  if (k === '__backup') { exportBackup(); return; }
  if (k === '__restore') { $('#backup-input').click(); return; }
  state.filter = k; render();
});

$('#main').addEventListener('click', (e) => {
  const fav = e.target.closest('[data-fav]');
  if (fav) {
    const id = fav.dataset.fav;
    state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id);
    saveMeta(); render(); return;
  }
  const menu = e.target.closest('[data-menu]');
  if (menu) { openMenu(menu.dataset.menu); return; }
  const row = e.target.closest('[data-play]');
  if (row) playSong(row.dataset.play, visibleSongs());
});

$('#backup-input').addEventListener('change', (e) => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; });
$('#pl-create').addEventListener('click', createPlFromForm);
$('#pl-cancel').addEventListener('click', hidePlForm);
$('#pl-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') createPlFromForm(); });
$('#plWrap').addEventListener('click', (e) => { if (e.target === $('#plWrap')) hidePlForm(); });

$('#sheetWrap').addEventListener('click', async (e) => {
  if (e.target === $('#sheetWrap')) { closeMenu(); return; }
  const b = e.target.closest('[data-act]'); if (!b || !sheetSongId) return;
  const id = sheetSongId, act = b.dataset.act;
  closeMenu();
  if (act === 'play') playSong(id, visibleSongs());
  else if (act === 'fav') { state.favorites.has(id) ? state.favorites.delete(id) : state.favorites.add(id); saveMeta(); render(); }
  else if (act === 'addpl') { const pl = state.playlists[Number(b.dataset.pl)]; if (pl && !pl.ids.includes(id)) { pl.ids.push(id); saveMeta(); toast('Added to “' + pl.name + '”'); } }
  else if (act === 'remove') removeSong(id);
});

const togglePlay = () => { if (!currentSong()) return; audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
$('#mini-play').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
$('#p-play').addEventListener('click', togglePlay);
$('#mini-next').addEventListener('click', (e) => { e.stopPropagation(); next(false); });
$('#mini-prev').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
const skipBy = (sec) => {
  if (isFinite(audio.duration) && audio.duration)
    audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), audio.duration);
};
$('#p-back30').addEventListener('click', () => skipBy(-30));
$('#p-fwd30').addEventListener('click', () => skipBy(30));
$('#p-next').addEventListener('click', () => next(false));
$('#p-prev').addEventListener('click', prev);
function renderCues() {
  const wrap = $('#cue-chips'); if (!wrap) return;
  const s = currentSong();
  const cues = (s && Array.isArray(s.cues)) ? s.cues : [];
  wrap.innerHTML = cues.map((cu, i) =>
    `<button class="eqchip" data-cue="${i}">${fmtTime(cu.t)}<span class="cuex" data-cuex="${i}">×</span></button>`).join('');
}
function addCue() {
  const s = currentSong(); if (!s) return;
  if (!isFinite(audio.duration) || !audio.duration) { toast('Play something first, then mark it'); return; }
  const t = Math.round(audio.currentTime * 10) / 10;
  if (!Array.isArray(s.cues)) s.cues = [];
  if (s.cues.some((cu) => Math.abs(cu.t - t) < 2)) { toast('There is already a cue near ' + fmtTime(t)); return; }
  s.cues.push({ t, label: '' });
  s.cues.sort((a, b) => a.t - b.t);
  DB.put('tracks', s).catch(() => {});
  renderCues(); drawWave();
  toast('Cue added at ' + fmtTime(t));
}
$('#cue-add').addEventListener('click', addCue);
$('#cue-chips').addEventListener('click', (e) => {
  const s = currentSong(); if (!s || !Array.isArray(s.cues)) return;
  const x = e.target.closest('[data-cuex]');
  if (x) {
    s.cues.splice(Number(x.dataset.cuex), 1);
    DB.put('tracks', s).catch(() => {});
    renderCues(); drawWave(); toast('Cue removed'); return;
  }
  const b = e.target.closest('[data-cue]');
  if (b) { const cu = s.cues[Number(b.dataset.cue)]; if (cu) { audio.currentTime = cu.t; audio.play().catch(() => {}); } }
});
const openPlayer = () => { $('#player').classList.remove('hidden'); setTimeout(() => { drawWave(); kickWave(); }, 40); };
$('#mini-meta').addEventListener('click', openPlayer);
$('#mini-art').addEventListener('click', openPlayer);
$('#p-close').addEventListener('click', () => $('#player').classList.add('hidden'));
$('#p-shuffle').addEventListener('click', () => { state.shuffle = !state.shuffle; saveMeta(); updatePlayerUI(); });
$('#p-repeat').addEventListener('click', () => {
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  saveMeta(); updatePlayerUI(); toast('Repeat: ' + state.repeat);
});
function applyRate() {
  audio.playbackRate = state.rate || 1;
  const lock = state.pitchLock !== false;
  try { audio.preservesPitch = lock; } catch (e) {}
  try { audio.webkitPreservesPitch = lock; } catch (e) {}
  document.querySelectorAll('#speed-chips [data-rate]').forEach((ch) => {
    const r = ch.dataset.rate;
    ch.classList.toggle('on', r === 'lock' ? lock : Math.abs(Number(r) - (state.rate || 1)) < 0.001);
  });
}
$('#speed-chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-rate]'); if (!b) return;
  if (b.dataset.rate === 'lock') {
    state.pitchLock = state.pitchLock === false;
    toast('Pitch lock: ' + (state.pitchLock ? 'on — pitch stays natural' : 'off — pitch shifts like vinyl'));
  } else {
    state.rate = Number(b.dataset.rate);
    toast('Speed: ' + state.rate + '×');
  }
  saveMeta(); applyRate();
});
$('#p-tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-ptab]'); if (!b) return;
  const k = b.dataset.ptab;
  document.querySelectorAll('#p-tabs .ptab').forEach((t) => t.classList.toggle('on', t === b));
  $('#row-theme').classList.toggle('hidden', k !== 'theme');
  $('#row-speed').classList.toggle('hidden', k !== 'speed');
  $('#row-cues').classList.toggle('hidden', k !== 'cues');
  $('#row-dance').classList.toggle('hidden', k !== 'dance');
});
$('#theme-chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-theme-name]'); if (!b) return;
  applyTheme(b.dataset.themeName);
  toast('Theme: ' + THEME_NAMES[state.theme]);
});
$('#btn-theme').addEventListener('click', () => {
  const nextTheme = THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length];
  applyTheme(nextTheme);
  toast('Theme: ' + THEME_NAMES[state.theme]);
});

audio.addEventListener('timeupdate', () => {
  if (isFinite(audio.duration) && audio.duration) {
    $('#p-cur').textContent = fmtTime(audio.currentTime);
    $('#p-dur').textContent = fmtTime(audio.duration);
    const mf = $('#mini-prog-fill');
    if (mf) mf.style.width = (audio.currentTime / audio.duration * 100) + '%';
    savePos(false);
    if (!$('#player').classList.contains('hidden') && !waveSeeking) drawWave();
    /* If the header duration was missing/wrong, learn the real one. */
    const s = currentSong();
    if (s && Math.abs((s.duration || 0) - audio.duration) > 1.5) {
      s.duration = Math.round(audio.duration * 10) / 10;
      DB.put('tracks', s).catch(() => {});
    }
  }
});
let lastPosSave = 0;
function savePos(force) {
  const s = currentSong();
  if (!s || !isFinite(audio.duration) || !audio.duration) return;
  if (!force && Date.now() - lastPosSave < 4000) return;
  lastPosSave = Date.now();
  const p = Math.floor(audio.currentTime);
  s.pos = (p > 5 && p < audio.duration - 10) ? p : 0;
  DB.put('tracks', s).catch(() => {});
}
audio.addEventListener('play', updatePlayerUI);
audio.addEventListener('pause', () => { savePos(true); updatePlayerUI(); });
audio.addEventListener('ended', () => {
  const s = currentSong();
  if (s && s.pos) { s.pos = 0; DB.put('tracks', s).catch(() => {}); }
  next(true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(true); });
window.addEventListener('pagehide', () => savePos(true));
audio.addEventListener('error', () => {
  if (state.currentId) toast('That file could not be played — it may have been moved or is in a format Safari can’t decode');
});

if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
    navigator.mediaSession.setActionHandler('seekto', (d) => { if (typeof d.seekTime === 'number') audio.currentTime = d.seekTime; });
    navigator.mediaSession.setActionHandler('seekbackward', () => skipBy(-30));
    navigator.mediaSession.setActionHandler('seekforward', () => skipBy(30));
  } catch (e) { /* older Safari */ }
}

/* ================= self-update check =================
 * GitHub Pages' CDN + the Home Screen app's cache can serve an old
 * build for ~10 min. version.txt is fetched with caching bypassed; if
 * it names a newer build than BUILD, a pill offers a one-tap reload.
 * The pill never forces anything — reloading mid-session would drop
 * session-only files, so the timing is Gabriel's choice. */
let updateDismissed = '';
let lastUpdCheck = 0;
async function checkForUpdate() {
  lastUpdCheck = Date.now();
  try {
    const r = await fetch('version.txt?cb=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (!v || v === BUILD || v === updateDismissed) return;
    const pill = $('#update-pill');
    pill.innerHTML = 'New version ' + esc(v) + ' is ready — tap to update<span class="x" id="update-x">×</span>';
    pill.classList.remove('hidden');
    pill.onclick = (e) => { if (e.target.id !== 'update-x') location.reload(); };
    const x = $('#update-x');
    if (x) x.addEventListener('click', (e) => { e.stopPropagation(); updateDismissed = v; pill.classList.add('hidden'); });
  } catch (e) { /* offline: ignore */ }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastUpdCheck > 5 * 60 * 1000) checkForUpdate();
});

/* Drag & drop (desktop convenience; harmless on iPhone) */
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => { e.preventDefault(); importFiles(e.dataTransfer.files); });

/* ================= boot ================= */
(async function boot() {
  await loadMeta();
  $('#sort').value = state.sort;
  applyTheme(state.theme, false);
  applyRate();
  checkForUpdate();
  const st = document.querySelector('header h1 small');
  if (st && !st.textContent.includes('build')) st.textContent += ' · build ' + BUILD;
  try {
    const tracks = await DB.getAll('tracks');
    const fileKeys = new Set(await DB.keys('files').catch(() => []));
    for (const t of tracks) {
      if (!t || !t.id) continue;
      t.persisted = fileKeys.has(t.id);
      /* A non-persisted record has no file until it is re-picked. */
      t.needsFile = !t.persisted;
      if (t.needsFile) t.sessionOnly = true;
      state.songs.push(t); state.byId.set(t.id, t);
    }
  } catch (e) { console.warn('Library load failed', e); }
  render(); updatePlayerUI();
  if (state.songs.some((s) => s.needsFile)) {
    toast('Some songs (large/session files) need their file re-picked once — tap + Add music and select them again');
  }
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { /* ignore */ }
})();
</script>
