  if (!s) return;
  if (!audio.paused) { wantPlay = false; interrupted = false; audio.pause(); return; }
  /* After a reload, the restored current song has no audio loaded yet
     (its object URL died with the page) — load it the same way tapping
     its library row does, instead of playing an empty element. */
  if (!currentUrl) { playSong(s.id, visibleSongs()); return; }
  wantPlay = true;
  audio.play().catch(() => {});
  /* An iOS interruption can leave the element paused with a dead
     pipeline: play() is accepted but nothing is fetched and the
     position never moves. Verify the start — but give the system a
     full 2 s, and only reload the source when the element is
     provably dead (still paused, position frozen, almost no data).
     A remote-control resume or a big file still buffering must be
     left alone: 5.11.1 revived too eagerly there and broke resume
     from AirPods / car controls entirely. */
  const t0 = audio.currentTime;
  setTimeout(() => {
    if (wantPlay && !audio.ended && audio.paused && audio.currentTime === t0 && audio.readyState < 3) revivePlayback();
  }, 2000);
};
$('#mini-play').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
$('#p-play').addEventListener('click', togglePlay);
$('#mini-next').addEventListener('click', (e) => { e.stopPropagation(); next(false); });
$('#mini-prev').addEventListener('click', (e) => { e.stopPropagation(); prev(); });
const skipBy = (sec) => {
  if (isFinite(audio.duration) && audio.duration)
    audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), audio.duration);
};
$('#p-back30').addEventListener('click', () => skipBy(-30));
$('#p-fwd30').addEventListener('click', () => skipBy(30));
$('#p-next').addEventListener('click', () => next(false));
$('#p-prev').addEventListener('click', prev);
function renderCues() {
  const wrap = $('#cue-chips'); if (!wrap) return;
  const s = currentSong();
  const cues = (s && Array.isArray(s.cues)) ? s.cues : [];
  wrap.innerHTML = cues.map((cu, i) =>
    `<button class="eqchip" data-cue="${i}">${fmtTime(cu.t)}<span class="cuex" data-cuex="${i}">×</span></button>`).join('');
}
function addCue() {
  const s = currentSong(); if (!s) return;
  if (!isFinite(audio.duration) || !audio.duration) { toast('Play something first, then mark it'); return; }
  let tRaw = audio.currentTime;
  if (s.beatOffset != null && (s.bpmExact || s.bpm)) {
    /* Snap the RAW playhead to the grid (before the 0.1 s cue rounding,
       which would otherwise eat most of the 60 ms snap window). */
    const T = 60 / (s.bpmExact || songBpm(s));
    const snapped = s.beatOffset + Math.round((tRaw - s.beatOffset) / T) * T;
    if (Math.abs(snapped - tRaw) <= 0.06) tRaw = snapped;
  }
  const t = Math.round(tRaw * 10) / 10;
  if (!Array.isArray(s.cues)) s.cues = [];
  if (s.cues.some((cu) => Math.abs(cu.t - t) < 2)) { toast('There is already a cue near ' + fmtTime(t)); return; }
  s.cues.push({ t, label: '' });
  s.cues.sort((a, b) => a.t - b.t);
  DB.put('tracks', s).catch(() => {});
  renderCues(); drawWave();
  toast('Cue added at ' + fmtTime(t));
}
$('#cue-add').addEventListener('click', addCue);
$('#cue-chips').addEventListener('click', (e) => {
  const s = currentSong(); if (!s || !Array.isArray(s.cues)) return;
  const x = e.target.closest('[data-cuex]');
  if (x) {
    s.cues.splice(Number(x.dataset.cuex), 1);
    DB.put('tracks', s).catch(() => {});
    renderCues(); drawWave(); toast('Cue removed'); return;
  }
  const b = e.target.closest('[data-cue]');
  if (b) { const cu = s.cues[Number(b.dataset.cue)]; if (cu) { audio.currentTime = cu.t; audio.play().catch(() => {}); } }
});
const openPlayer = () => { $('#player').classList.remove('hidden'); setTimeout(() => { drawWave(); kickWave(); }, 40); };
$('#mini-meta').addEventListener('click', openPlayer);
$('#mini-art').addEventListener('click', openPlayer);
$('#p-close').addEventListener('click', () => $('#player').classList.add('hidden'));
$('#p-shuffle').addEventListener('click', () => { state.shuffle = !state.shuffle; saveMeta(); updatePlayerUI(); });
$('#p-repeat').addEventListener('click', () => {
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  saveMeta(); updatePlayerUI(); toast('Repeat: ' + state.repeat);
});
function applyRate() {
  audio.playbackRate = state.rate || 1;
  const lock = state.pitchLock !== false;
  try { audio.preservesPitch = lock; } catch (e) {}
  try { audio.webkitPreservesPitch = lock; } catch (e) {}
  document.querySelectorAll('#speed-chips [data-rate]').forEach((ch) => {
    const r = ch.dataset.rate;
    ch.classList.toggle('on', r === 'lock' ? lock : Math.abs(Number(r) - (state.rate || 1)) < 0.001);
  });
}
$('#speed-chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-rate]'); if (!b) return;
  if (b.dataset.rate === 'lock') {
    state.pitchLock = state.pitchLock === false;
    toast('Pitch lock: ' + (state.pitchLock ? 'on — pitch stays natural' : 'off — pitch shifts like vinyl'));
  } else {
    state.rate = Number(b.dataset.rate);
    toast('Speed: ' + state.rate + '×');
  }
  saveMeta(); applyRate();
});
$('#p-tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-ptab]'); if (!b) return;
  const k = b.dataset.ptab;
  document.querySelectorAll('#p-tabs .ptab').forEach((t) => t.classList.toggle('on', t === b));
  $('#row-theme').classList.toggle('hidden', k !== 'theme');
  $('#row-speed').classList.toggle('hidden', k !== 'speed');
  $('#row-cues').classList.toggle('hidden', k !== 'cues');
  $('#row-dance').classList.toggle('hidden', k !== 'dance');
  $('#row-wave').classList.toggle('hidden', k !== 'wave');
  $('#row-stage').classList.toggle('hidden', k !== 'stage');
});
const WAVE_HEIGHTS = { bands: '54px', led: '64px', curve: '64px' };
let waveHeightApplied = '';
function applyWaveStyle() {
  /* A saved style can outlive the style itself (Radial was removed in
     5.6.2) — anything unknown falls back to the 3-Band scroll. */
  let st = state.waveStyle || 'bands';
  if (st !== 'bands' && st !== 'led' && st !== 'curve') { st = 'bands'; state.waveStyle = 'bands'; }
  document.querySelectorAll('#wave-chips [data-wave]').forEach((ch) =>
    ch.classList.toggle('on', ch.dataset.wave === st));
  const h = WAVE_HEIGHTS[st] || '54px';
  if (scrollCv && waveHeightApplied !== h) { scrollCv.style.height = h; waveHeightApplied = h; }
  applyWaveShape();
}
function applyWaveShape() {
  const sh = document.querySelector('#wave-chips [data-waveshape]');
  if (!sh) return;
  const rms = state.waveMode === 'rms';
  sh.textContent = rms ? 'Shape: RMS' : 'Shape: Peaks';
  sh.classList.toggle('on', rms);
}
$('#wave-chips').addEventListener('click', (e) => {
  const shb = e.target.closest('[data-waveshape]');
  if (shb) {
    state.waveMode = state.waveMode === 'rms' ? 'peaks' : 'rms';
    saveMeta(); applyWaveShape();
    if (!$('#player').classList.contains('hidden')) drawWave();
    toast(state.waveMode === 'rms' ? 'Waveform shape: RMS (average level)' : 'Waveform shape: Peaks');
    return;
  }
  const b = e.target.closest('[data-wave]'); if (!b) return;
  state.waveStyle = b.dataset.wave;
  saveMeta(); applyWaveStyle();
  if (!$('#player').classList.contains('hidden')) drawWave();
  toast('Wave style: ' + b.textContent);
});
function applyStageStyle() {
  const st = state.stageStyle || 'art';
  document.querySelectorAll('#stage-chips [data-stage]').forEach((ch) =>
    ch.classList.toggle('on', ch.dataset.stage === st));
}
$('#stage-chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-stage]'); if (!b) return;
  state.stageStyle = b.dataset.stage;
  saveMeta(); applyStageStyle();
  if (!$('#player').classList.contains('hidden')) drawWave();
  toast('Stage: ' + b.textContent);
});
$('#theme-chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-theme-name]'); if (!b) return;
  applyTheme(b.dataset.themeName);
  toast('Theme: ' + THEME_NAMES[state.theme]);
});
$('#btn-theme').addEventListener('click', () => {
  const nextTheme = THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length];
  applyTheme(nextTheme);
  toast('Theme: ' + THEME_NAMES[state.theme]);
});

audio.addEventListener('timeupdate', () => {
  if (!audio.paused && state.currentId) {
    if (listenSongId !== state.currentId) { listenSongId = state.currentId; listenLast = -1; listenAcc = 0; }
    const ct = audio.currentTime;
    if (listenLast >= 0) { const d = ct - listenLast; if (d > 0 && d <= 2) listenAcc += d; }
    listenLast = ct;
  }
  if (isFinite(audio.duration) && audio.duration) {
    $('#p-cur').textContent = fmtTime(audio.currentTime);
    $('#p-dur').textContent = fmtTime(audio.duration);
    const mf = $('#mini-prog-fill');
    if (mf) mf.style.width = (audio.currentTime / audio.duration * 100) + '%';
    savePos(false);
    if (!$('#player').classList.contains('hidden') && !waveSeeking) drawWave();
    /* If the header duration was missing/wrong, learn the real one. */
    const s = currentSong();
    if (s && Math.abs((s.duration || 0) - audio.duration) > 1.5) {
      s.duration = Math.round(audio.duration * 10) / 10;
      DB.put('tracks', s).catch(() => {});
    }
  }
});
let lastPosSave = 0;
function savePos(force) {
  const s = currentSong();
  if (!s || !isFinite(audio.duration) || !audio.duration) return;
  if (!force && Date.now() - lastPosSave < 4000) return;
  lastPosSave = Date.now();
  const p = Math.floor(audio.currentTime);
  s.pos = (p > 5 && p < audio.duration - 10) ? p : 0;
  DB.put('tracks', s).catch(() => {});
}
audio.addEventListener('play', updatePlayerUI);
audio.addEventListener('pause', () => { savePos(true); updatePlayerUI(); });

/* ================= interruption recovery =================
 * An alarm, call or Siri prompt makes iOS pause the element from
 * outside the page, and the media pipeline can die with it: the
 * song then neither plays nor fetches — play() is accepted and
 * nothing moves, forever, until the song is re-tapped. These
 * listeners detect a system pause (one that arrives while the user
 * still wants playback) and revivePlayback() reloads the source
 * and resumes at the interrupted position. A pause the user asked
 * for clears wantPlay first, so recovery never overrides him. */
audio.addEventListener('play', () => { wantPlay = true; interrupted = false; });
audio.addEventListener('pause', () => {
  flushListen();
  if (wantPlay && state.currentId && !audio.ended) { interrupted = true; interruptPos = audio.currentTime || 0; }
});
async function revivePlayback() {
  const s = currentSong();
  if (!s || !wantPlay) return;
  const now = Date.now();
  if (now - lastReviveAt < 5000) return;
  lastReviveAt = now;
  const token = ++playToken;
  const file = await getPlayableFile(s);
  if (token !== playToken || !file) return;
  const at = interruptPos > 0 ? interruptPos : (s.pos > 5 ? s.pos : 0);
  if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
  currentUrl = URL.createObjectURL(file);
  audio.src = currentUrl;
  applyRate();
  if (at > 0) {
    const onMeta = () => {
      audio.removeEventListener('loadedmetadata', onMeta);
      if (token === playToken && isFinite(audio.duration) && at < audio.duration - 2) { try { audio.currentTime = at; } catch (e) {} }
    };
    audio.addEventListener('loadedmetadata', onMeta);
  }
  audio.play().catch(() => {});
  /* No retry chain: if this revive does not take, the next play
     press tries the plain path first again. 5.11.1 retried on a
     timer and eventually marked playback unwanted — while iOS was
     still restoring a remote-control resume, that churn was the
     whole bug. */
}
/* Coming back to the app after an interruption resumes the song,
   like a native player: a plain play() first (usually the system
   just needs the nudge), and a source reload only if the element
   turns out to be provably dead. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && interrupted && wantPlay && audio.paused) {
    const t0 = audio.currentTime;
    audio.play().catch(() => {});
    setTimeout(() => {
      if (wantPlay && !audio.ended && audio.paused && audio.currentTime === t0 && audio.readyState < 3) revivePlayback();
    }, 2000);
  }
});
audio.addEventListener('ended', () => {
  const s = currentSong();
  flushListen();
  if (s) { s.completions = (s.completions || 0) + 1; if (s.pos) s.pos = 0; DB.put('tracks', s).catch(() => {}); }
  next(true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { savePos(true); flushListen(); } });
window.addEventListener('pagehide', () => savePos(true));
audio.addEventListener('error', () => {
  if (state.currentId) toast('That file could not be played — it may have been moved or is in a format Safari can’t decode');
});

if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.setActionHandler('play', () => { if (audio.paused) togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', () => { wantPlay = false; interrupted = false; audio.pause(); });
    navigator.mediaSession.setActionHandler('previoustrack', prev);
    navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
    navigator.mediaSession.setActionHandler('seekto', (d) => { if (typeof d.seekTime === 'number') audio.currentTime = d.seekTime; });
    navigator.mediaSession.setActionHandler('seekbackward', () => skipBy(-30));
    navigator.mediaSession.setActionHandler('seekforward', () => skipBy(30));
  } catch (e) { /* older Safari */ }
}

/* ================= self-update check =================
 * GitHub Pages' CDN + the Home Screen app's cache can serve an old
 * build for ~10 min. version.txt is fetched with caching bypassed; if
 * it names a newer build than BUILD, a pill offers a one-tap reload.
 * The pill never forces anything — reloading mid-session would drop
 * session-only files, so the timing is Gabriel's choice. */
let updateDismissed = '';
let lastUpdCheck = 0;
async function checkForUpdate() {
  lastUpdCheck = Date.now();
  try {
    const r = await fetch('version.txt?cb=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (!v || v === BUILD || v === updateDismissed) return;
    const pill = $('#update-pill');
    pill.innerHTML = 'New version ' + esc(v) + ' is ready — tap to update<span class="x" id="update-x">×</span>';
    pill.classList.remove('hidden');
    pill.onclick = (e) => { if (e.target.id !== 'update-x') location.reload(); };
    const x = $('#update-x');
    if (x) x.addEventListener('click', (e) => { e.stopPropagation(); updateDismissed = v; pill.classList.add('hidden'); });
  } catch (e) { /* offline: ignore */ }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - lastUpdCheck > 5 * 60 * 1000) checkForUpdate();
});

/* Drag & drop (desktop convenience; harmless on iPhone) */
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => { e.preventDefault(); importFiles(e.dataTransfer.files); });

/* ================= boot ================= */
(async function boot() {
  await loadMeta();
  $('#sort').value = state.sort;
  applyTheme(state.theme, false);
  maybeShowWhatsNew();
  applyRate();
  applyWaveStyle();
  applyStageStyle();
  checkForUpdate();
  const st = document.querySelector('header h1 small');
  if (st && !st.textContent.includes('build')) st.textContent += ' · build ' + BUILD;
  try {
    const tracks = await DB.getAll('tracks');
    const fileKeys = new Set(await DB.keys('files').catch(() => []));
    const audioKeys = new Set();
    const directory = await audioDirectory().catch(() => null);
    try {
      if (directory) {
        for await (const [key, handle] of directory.entries()) {
          if (handle.kind === 'file') audioKeys.add(key);
        }
      }
    } catch (error) { console.warn('Stored audio could not be listed', error); }
    for (const t of tracks) {
      if (!t || !t.id) continue;
      delete t._bpmBusy; delete t._peaksBusy;
      t.persisted = audioKeys.has(t.audioKey) || fileKeys.has(t.id);
      /* A non-persisted record has no file until it is re-picked. */
      t.needsFile = !t.persisted;
      t.sessionOnly = t.needsFile;
      state.songs.push(t); state.byId.set(t.id, t);
    }
  } catch (e) { console.warn('Library load failed', e); }
  render(); updatePlayerUI();
  if (state.songs.some((s) => s.needsFile)) {
    toast('Some songs need their audio files. Tap + Add music and select the original files again.');
  }
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { /* ignore */ }
})();
</script>
